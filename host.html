async function confirmHostAgain(oldSessionId) {
  const name = document.getElementById('hostAgainName').value.trim() || 'Session';
  const courtCount = parseInt(document.getElementById('hostAgainCourts').value, 10) || 1;
  const errorEl = document.getElementById('hostAgainError');

  const oldSession = await SessionAPI.getSession(oldSessionId);
  const isTournament = oldSession.session_type === 'tournament';
  const chips = [...document.querySelectorAll('#hostAgainChecklist .player-check.selected')];

  try {
    const newSession = await SessionAPI.createSession({ name, format: oldSession.format, courtCount, sessionType: oldSession.session_type || 'open_play' });

    if (isTournament) {
      const carryTeams = chips.map(el => ({
        team_name: el.dataset.name, player1_name: el.dataset.p1 || null, player2_name: el.dataset.p2 || null,
        logo_url: el.dataset.logo || null, player1_photo: el.dataset.p1photo || null, player2_photo: el.dataset.p2photo || null,
      }));
      if (carryTeams.length > 0) await SessionAPI.carryTeamsToNewSession(newSession.id, carryTeams);
      document.getElementById('hostAgainModal').remove();
      // Tournament sessions are managed on their own page, not inside the
      // open-play console — this is the fix: previously every "Host Again"
      // routed through openSession() (the open-play roster/arrive/shuffle
      // UI) regardless of what type the new session actually was.
      window.location.href = `tournament.html?session=${newSession.id}`;
    } else {
      const carryPlayers = chips.map(el => ({ name: el.dataset.name, skill_tier: el.dataset.tier }));
      if (carryPlayers.length > 0) await SessionAPI.carryPlayersToNewSession(newSession.id, carryPlayers);
      document.getElementById('hostAgainModal').remove();
      await openSession(newSession.id);
    }
  } catch (err) { errorEl.textContent = err.message; }
}

async function handleShuffleQueue() {
  if (_queueStarted) {
    alert('Queuing has already started for this session — players are stacking automatically now. Shuffle is a one-time action.');
    return;
  }
  if (!confirm('Shuffle all waiting players into a random queue order and fill open courts?\n\nThis is a ONE-TIME action — after this, everyone stacks by the win/loss queue automatically.')) return;
  try {
    const n = await SessionAPI.shuffleQueue(activeSession.id);
    if (n === 0) { alert('No waiting players to shuffle. Mark players as Arrived first.'); return; }
    _queueStarted = true;
    try { localStorage.setItem('istackyyy_qstart_' + activeSession.id, '1'); } catch {}
    await renderActiveTab();
  } catch (err) { alert(err.message || 'Could not shuffle queue.'); }
}

// Per-session flag — true once the host has shuffled/started queuing.
let _queueStarted = false;

// ════════════════════════════════════════════
// QUEUE TAB — same "Up Next" paddle-stack preview as the spectator page,
// available to the host directly. Reuses the REAL engine functions
// (decideNextMatchFromPool etc. — no read-only copy needed here, this
// file already IS the source of truth) so the preview always exactly
// matches what will actually happen when a court frees up.
// ════════════════════════════════════════════
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// Simulates every upcoming match by repeatedly running the real engine on
// a shrinking copy of the waiting pool. Everyone ends up in SOME preview —
// a full group where possible, a smaller "waiting" card for leftovers.
function generateQueuePreviewsHost(waiting, teamSize) {
  let pool = waiting.map(p => ({ ...p }));
  const previews = [];
  while (pool.length > 0) {
    const decision = decideNextMatchFromPool(pool, teamSize);
    if (decision) {
      const byId = id => pool.find(p => p.id === id);
      const teamA = decision.teamAPlayerIds.map(byId);
      const teamB = decision.teamBPlayerIds.map(byId);
      previews.push({ complete: true, teamA, teamB });
      const usedIds = new Set([...decision.teamAPlayerIds, ...decision.teamBPlayerIds]);
      pool = pool.filter(p => !usedIds.has(p.id));
    } else {
      const allSameResult = pool.length && pool.every(p => p.last_match_result === pool[0].last_match_result && pool[0].last_match_result);
      previews.push({ complete: false, teamA: pool, resultLabel: allSameResult ? pool[0].last_match_result : null });
      pool = [];
    }
  }
  return previews;
}

function buildPreviewCardHost(preview, pageIndex, teamSize) {
  const label = `${ordinal(pageIndex + 1)} in Stack`;
  let badge = '';
  if (!preview.complete && preview.resultLabel) {
    badge = preview.resultLabel === 'won'
      ? '<span class="mp-badge result-won">Winning</span>'
      : '<span class="mp-badge result-lost">Losing</span>';
  }
  const teamARow = `<div class="mp-team-row">${preview.teamA.map(p => paddleChipHost(p)).join('')}</div>`;
  const teamBRow = preview.complete
    ? `<div class="mp-team-row">${preview.teamB.map(p => paddleChipHost(p)).join('')}</div>`
    : `<div class="mp-placeholder">Waiting for ${preview.teamA.length > 1 ? 'more players' : 'a match'}…</div>`;
  return `<div class="mp-card${preview.complete ? '' : ' partial'}">
    <div class="mp-card-label"><span>${label}${pageIndex === 0 ? ' <span style="opacity:.7;font-weight:600">(Next)</span>' : ''}</span>${badge}</div>
    <div class="mp-teams">
      ${teamARow}
      <span class="mp-vs">VS</span>
      ${teamBRow}
    </div>
  </div>`;
}

function computeCardsPerPageHost(containerEl) {
  const w = containerEl?.clientWidth || window.innerWidth;
  if (w < 480) return 1;
  if (w < 800) return 2;
  if (w < 1120) return 3;
  return 4;
}

window._queuePreviews = [];
window._queuePageIndex = 0;

// ════════════════════════════════════════════
// MANUAL MODE — draft cards (flexible pairing arrangement) + 4 live status
// lanes (Winning/Losing/Resting/Late Arrivals). No auto-pairing: the host
// builds each match by hand, one card at a time.
// ════════════════════════════════════════════
// { playerId, fromCardId, fromSlotNum } of whatever's currently "picked
// up" via tap — null if nothing is. fromCardId/fromSlotNum are null when
// the picked-up player came from the waiting pool rather than a card.
window._draftSelected = window._draftSelected || null;

// Proper stopwatch format — HH:MM:SS, always, extending naturally for
// however long someone's actually been waiting (not "1h 5m" shorthand).
function elapsedLabel(iso) {
  if (!iso) return '00:00:00';
  const totalSecs = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  const hrs  = Math.floor(totalSecs / 3600);
  const mins = Math.floor((totalSecs % 3600) / 60);
  const secs = totalSecs % 60;
  return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

// ════════════════════════════════════════════
// PLAYER SWAP — mid-match (live court) or mid-queue (not-yet-started
// team) substitution. Works the same way in both automated and manual
// open-play modes, since it operates on teams.player_ids directly rather
// than anything mode-specific.
// ════════════════════════════════════════════

// Players not currently spoken for by ANYTHING — not playing, not resting,
// not already queued into a prepared match. Shared eligibility check so
// the substitute picker can never offer someone who's already committed
// elsewhere, matching the same invariant the duplicate-stacking fix
// protects: one player, one status, at any given moment.
async function getEligibleSubstitutes(sessionId, excludePlayerIds) {
  const players = await SessionAPI.getPlayers(sessionId);
  const prepared = await SessionAPI.getPreparedMatches(sessionId);
  const queuedIds = new Set();
  for (const pm of prepared) {
    (pm.team_a?.player_ids || []).forEach(id => queuedIds.add(id));
    (pm.team_b?.player_ids || []).forEach(id => queuedIds.add(id));
  }
  const exclude = new Set(excludePlayerIds || []);
  return players.filter(p => p.status === 'waiting' && !queuedIds.has(p.id) && !exclude.has(p.id));
}

async function openQueueSwapModal(preparedMatchId) {

}

async function startSwapFor(teamId, oldPlayerId, isLive) {
  document.getElementById('swapModal')?.remove();
  const players = await SessionAPI.getPlayers(activeSession.id);
  const departing = players.find(p => p.id === oldPlayerId);
  const eligible = await getEligibleSubstitutes(activeSession.id, [oldPlayerId]);

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop" id="swapPickModal">
      <div class="modal-box">
        <h2>Substitute for ${escapeHtml(departing?.name || 'this player')}</h2>

          <select id="swapSubstituteSelect">
            <option value="">— Select a player —</option>

async function confirmPlayerSwap(teamId, oldPlayerId) {
  const newPlayerId = document.getElementById('swapSubstituteSelect')?.value;
  const disposition = document.getElementById('swapDispositionSelect')?.value;
  const errEl = document.getElementById('swapError');
  const btn = document.getElementById('swapConfirmBtn');
  if (!newPlayerId) { errEl.textContent = 'Choose a substitute.'; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Swapping…'; }
  try {
    await SessionAPI.swapPlayerOnTeam(teamId, oldPlayerId, newPlayerId, disposition);
    document.getElementById('swapPickModal')?.remove();
    renderActiveTab();
  } catch (err) {
    errEl.textContent = err.message || 'Could not complete the swap.';
    if (btn) { btn.disabled = false; btn.textContent = 'Confirm Swap'; }
  }
}

async function manualBoardHtml() {
  const players = await SessionAPI.getPlayers(activeSession.id);
  const playerById = id => players.find(p => p.id === id);

  const prepared = await SessionAPI.getPreparedMatches(activeSession.id);
  const draftCards = await SessionAPI.getDraftCards(activeSession.id);

  // Anyone already committed to a queued match OR already placed on a
  // draft card can't be picked again elsewhere — same invariant as
  // before (one player, one spot, ever), just now covering two places
  // instead of one. Derived straight from what's visibly on screen in
  // both cases, same reasoning as the original duplicate-stacking fix.
  const queuedPlayerIds = new Set();
  for (const pm of prepared) {
    (pm.team_a?.player_ids || []).forEach(id => queuedPlayerIds.add(id));
    (pm.team_b?.player_ids || []).forEach(id => queuedPlayerIds.add(id));
  }
  const draftPlayerIds = new Set();
  draftCards.forEach(c => [c.slot_1, c.slot_2, c.slot_3, c.slot_4].forEach(id => { if (id) draftPlayerIds.add(id); }));

  const byOldest = (a, b) => new Date(a.became_free_at || 0) - new Date(b.became_free_at || 0);
  const eligible = (p) => !queuedPlayerIds.has(p.id) && !draftPlayerIds.has(p.id);
  const winning = players.filter(p => p.status === 'waiting' && p.last_match_result === 'won' && eligible(p)).sort(byOldest);
  const losing  = players.filter(p => p.status === 'waiting' && p.last_match_result === 'lost' && eligible(p)).sort(byOldest);
  const resting = players.filter(p => p.status === 'resting' && eligible(p)).sort(byOldest);
  const lateArrivals = players.filter(p => p.status === 'waiting' && !p.last_match_result && eligible(p)).sort(byOldest);

  // A previously-picked-up selection can go stale (its player got queued
  // by someone else, etc.) — drop it rather than let a tap silently fail.
  if (window._draftSelected) {
    const stillThere = window._draftSelected.fromCardId
      ? draftCards.some(c => c.id === window._draftSelected.fromCardId)
      : players.some(p => p.id === window._draftSelected.playerId && eligible(p));
    if (!stillThere) window._draftSelected = null;
  }

  setTimeout(startManualBoardTimers, 0);

  return `
    <div class="card" style="padding:14px 16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:800;font-size:13px;">🎛 Arrange Matches</div>
          <div style="font-size:11px;color:var(--resting-slate);">Drag a paddle onto a slot, or tap one then tap where it goes — swaps automatically if the slot's taken.</div>
        </div>
        <button onclick="handleCreateDraftCard()" style="background:var(--optic-yellow);color:var(--optic-yellow-ink);border:none;padding:9px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:12px;min-height:40px;cursor:pointer;flex-shrink:0;">+ New Card</button>
      </div>
      <div id="manualBuildError" class="auth-error" style="margin-top:6px;"></div>
    </div>

    ${draftCards.length ? `
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;">
      ${draftCards.map(c => draftCardHtml(c, playerById)).join('')}
    </div>` : ''}

    ${prepared.length ? `
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="lane-header" style="background:var(--waiting-blue);"><span>Up Next</span><span class="count">${prepared.length}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;padding:14px 12px;">
        ${prepared.map((pm, i) => preparedMatchCardHtml(pm, i, players)).join('')}
      </div>
    </div>` : ''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      ${manualCardHtml('🏆 Winning', 'var(--winner-green)', winning, 'Waiting')}
      ${manualCardHtml('💔 Losing', 'var(--loser-coral)', losing, 'Waiting')}
      ${manualCardHtml('☕ Resting', 'var(--bench-slate)', resting, 'Resting')}
      ${manualCardHtml('🆕 Late Arrivals', 'var(--waiting-blue)', lateArrivals, 'Arrived')}
    </div>
  `;
}

// One draft card: two rows of two slots (top row = Team A, bottom row =
// Team B), each slot either holding a paddle or showing an empty dashed
// placeholder. Every paddle is BOTH draggable AND tappable — whichever
// interaction works better on the host's device, both do the same thing.
function draftCardHtml(card, playerById) {
  const slots = [card.slot_1, card.slot_2, card.slot_3, card.slot_4];
  const filledCount = slots.filter(Boolean).length;
  const allFilled = filledCount === 4;

  function slotHtml(slotNum) {
    const pid = slots[slotNum - 1];
    const isSelected = window._draftSelected?.fromCardId === card.id && window._draftSelected?.fromSlotNum === slotNum;
    if (!pid) {
      return `<div class="draft-slot draft-slot-empty${isSelected ? ' draft-slot-selected' : ''}"
        ondragover="event.preventDefault()" ondrop="handleDraftDrop(event,'${card.id}',${slotNum})"
        onclick="handleDraftSlotTap('${card.id}',${slotNum})">
        <span style="font-size:20px;opacity:.3;">＋</span>
      </div>`;
    }
    const p = playerById(pid) || { name: '—' };
    return `<div class="draft-slot${isSelected ? ' draft-slot-selected' : ''}" draggable="true"
      ondragstart="handleDraftDragStart(event,'${p.id}','${card.id}',${slotNum})"
      ondragover="event.preventDefault()" ondrop="handleDraftDrop(event,'${card.id}',${slotNum})"
      onclick="handleDraftSlotTap('${card.id}',${slotNum})">
      ${paddleChipHost(p)}
    </div>`;
  }

  return `<div class="draft-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:10px;font-weight:800;color:var(--bench-slate);letter-spacing:.05em;">CARD · ${filledCount}/4</span>
      <button onclick="handleDeleteDraftCard('${card.id}')" style="background:none;border:none;color:var(--fault-coral);font-size:10px;font-weight:800;cursor:pointer;min-height:0;padding:2px 4px;">✕ Remove</button>
    </div>
    <div class="draft-card-row">${slotHtml(1)}${slotHtml(2)}</div>
    <div class="draft-card-vs">VS</div>
    <div class="draft-card-row">${slotHtml(3)}${slotHtml(4)}</div>
    ${allFilled
      ? `<button onclick="handlePromoteDraftCard('${card.id}')" style="width:100%;margin-top:8px;background:var(--winner-green);color:#0A1620;border:none;padding:9px;border-radius:var(--radius-sm);font-weight:800;font-size:12px;cursor:pointer;">Queue This Match →</button>`
      : `<p style="font-size:11px;color:var(--resting-slate);text-align:center;margin:8px 0 0;">Drag or tap players in — fill all 4 to queue.</p>`}
  </div>`;
}

async function handleCreateDraftCard() {
  if (!uiGuardStart('createDraftCard')) return;
  const errEl = document.getElementById('manualBuildError');
  try {
    await SessionAPI.createDraftCard(activeSession.id);
    document.getElementById('tabPanel').innerHTML = await manualBoardHtml();
  } catch (err) {
    if (errEl) errEl.textContent = err.message || 'Could not create a new card.';
  } finally {
    uiGuardEnd('createDraftCard');
  }
}

async function handleDeleteDraftCard(cardId) {
  if (!uiGuardStart('deleteDraftCard-' + cardId)) return;
  try {
    await SessionAPI.deleteDraftCard(cardId);
    window._draftSelected = null;
    document.getElementById('tabPanel').innerHTML = await manualBoardHtml();
  } catch (err) {
    alert(err.message || 'Could not remove this card.');
  } finally {
    uiGuardEnd('deleteDraftCard-' + cardId);
  }
}

// ── Tap interaction — always works, regardless of device/browser drag
// support. Tapping "picks up" a player (from the pool OR a card slot);
// tapping again elsewhere either places them (empty slot), swaps them
// with whoever's there (filled slot), or deselects (tapping the same
// spot again). ──
function handleDraftPoolTap(playerId) {
  const sel = window._draftSelected;
  if (sel && sel.playerId === playerId && !sel.fromCardId) {
    window._draftSelected = null; // tapped the same pool player again — deselect
  } else {
    window._draftSelected = { playerId, fromCardId: null, fromSlotNum: null };
  }
  renderActiveTab();
}

async function handleDraftSlotTap(cardId, slotNum) {
  const sel = window._draftSelected;
  if (!sel) {
    // Nothing picked up yet — if this slot is filled, pick IT up.
    const cards = await SessionAPI.getDraftCards(activeSession.id);
    const card = cards.find(c => c.id === cardId);
    const pid = card ? card[`slot_${slotNum}`] : null;
    if (!pid) return; // empty slot, nothing to pick up, nothing to do
    window._draftSelected = { playerId: pid, fromCardId: cardId, fromSlotNum: slotNum };
    renderActiveTab();
    return;
  }
  if (sel.fromCardId === cardId && sel.fromSlotNum === slotNum) {
    window._draftSelected = null; // tapped the same slot again — deselect
    renderActiveTab();
    return;
  }
  // Something's picked up and we tapped a DIFFERENT slot — place/swap it there.
  if (!uiGuardStart('draftAssign')) return;
  try {
    await SessionAPI.assignDraftSlot(cardId, slotNum, sel.playerId, sel.fromCardId, sel.fromSlotNum);
  } catch (err) {
    alert(err.message || 'Could not move this player.');
  } finally {
    window._draftSelected = null;
    uiGuardEnd('draftAssign');
    document.getElementById('tabPanel').innerHTML = await manualBoardHtml();
  }
}

// ── Drag interaction — layered on TOP of the same tap targets, so both
// work on the exact same elements. Whichever behaves better on the host's
// device is the one they'll naturally end up using. ──
function handleDraftDragStart(event, playerId, fromCardId, fromSlotNum) {
  event.dataTransfer.setData('text/plain', JSON.stringify({ playerId, fromCardId, fromSlotNum }));
  event.dataTransfer.effectAllowed = 'move';
}
async function handleDraftDrop(event, cardId, slotNum) {
  event.preventDefault();
  let data;
  try { data = JSON.parse(event.dataTransfer.getData('text/plain')); } catch { return; }
  if (!data || !data.playerId) return;
  if (data.fromCardId === cardId && data.fromSlotNum === slotNum) return; // dropped back where it came from
  if (!uiGuardStart('draftAssign')) return;
  try {
    await SessionAPI.assignDraftSlot(cardId, slotNum, data.playerId, data.fromCardId, data.fromSlotNum);
  } catch (err) {
    alert(err.message || 'Could not move this player.');
  } finally {
    window._draftSelected = null;
    uiGuardEnd('draftAssign');
    document.getElementById('tabPanel').innerHTML = await manualBoardHtml();
  }
}
// Dropping onto (or tapping-away-into) a waiting-pool lane clears the
// player's card slot, returning them to the pool.
async function handleDraftReturnToPool(event) {
  event.preventDefault();
  let data;
  try { data = JSON.parse(event.dataTransfer.getData('text/plain')); } catch { return; }
  if (!data || !data.fromCardId) return; // came from the pool already, nothing to do
  if (!uiGuardStart('draftReturn')) return;
  try {
    await SessionAPI.clearDraftSlot(data.fromCardId, data.fromSlotNum);
  } catch (err) {
    alert(err.message || 'Could not return this player to the pool.');
  } finally {
    window._draftSelected = null;
    uiGuardEnd('draftReturn');
    document.getElementById('tabPanel').innerHTML = await manualBoardHtml();
  }
}

// Ticks every live timer in the 4 cards once a second without re-rendering
// the whole board (avoids flicker + loses no scroll position / selection).
function startManualBoardTimers() {
  if (window._manualTimerInterval) clearInterval(window._manualTimerInterval);
  window._manualTimerInterval = setInterval(() => {
    document.querySelectorAll('.manual-timer').forEach(el => {
      const since = el.dataset.since;
      const verb  = el.dataset.verb;
      if (since) el.textContent = `${verb} ${elapsedLabel(since)}`;

async function queueTabHtml() {
  if (activeSession?.open_play_mode === 'manual') return manualBoardHtml();

  const players = await SessionAPI.getPlayers(activeSession.id);
  const waiting = players.filter(p => p.status === 'waiting')
    .sort((a, b) => new Date(a.became_free_at) - new Date(b.became_free_at));

  if (!waiting.length) {
    window._queuePreviews = [];
    return `<div class="card" style="text-align:center;padding:24px;color:var(--bench-slate);font-size:13px;">No one in the queue right now</div>`;
  }

  const teamSize = activeSession?.format === 'singles' ? 1 : 2;
  window._queuePreviews = generateQueuePreviewsHost(waiting, teamSize);
  window._queuePageIndex = 0;
  window._queueTeamSize = teamSize;

  setTimeout(() => {
    renderQueueCard();
    if (!window._queueResizeBound) {
      window._queueResizeBound = true;
      let t;
      window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(renderQueueCard, 150); });
    }
  }, 0);

  return `
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="lane-header" style="background:var(--waiting-blue);"><span>Up Next</span><span class="count">${waiting.length}</span></div>
      <div class="mp-pager" id="hostQueuePager"></div>
    </div>
  `;
}

function renderQueueCard() {
  const pager = document.getElementById('hostQueuePager');
  if (!pager) return;
  const previews = window._queuePreviews;
  const total = previews.length;
  if (!total) { pager.innerHTML = ''; return; }

  const perPage = Math.max(1, Math.min(computeCardsPerPageHost(document.getElementById('hostQueuePager')?.closest('.card')), total));
  const maxStart = Math.max(0, total - perPage);
  if (window._queuePageIndex > maxStart) window._queuePageIndex = maxStart;
  const idx = window._queuePageIndex;

  const visible = previews.slice(idx, idx + perPage);
  const cardsHtml = visible.map((p, i) => buildPreviewCardHost(p, idx + i, window._queueTeamSize)).join('');

  pager.innerHTML = `
    <button class="mp-nav-btn" onclick="navigateQueue(-1)" ${idx === 0 ? 'disabled' : ''} aria-label="Previous">‹</button>
    <div class="mp-pager-row">${cardsHtml}</div>
    <button class="mp-nav-btn" onclick="navigateQueue(1)" ${idx + perPage >= total ? 'disabled' : ''} aria-label="Next">›</button>
  `;
}

function navigateQueue(direction) {
  const total = window._queuePreviews.length;
  const perPage = Math.max(1, Math.min(computeCardsPerPageHost(document.getElementById('hostQueuePager')?.closest('.card')), total));
  const next = window._queuePageIndex + direction * perPage;
  if (next < 0 || next >= total) return;
  window._queuePageIndex = next;
  renderQueueCard();
}

}

async function handleArrived(playerId) {
  if (!uiGuardStart('arrived-' + playerId)) return;
  const isManualMode = activeSession?.open_play_mode === 'manual';
  try {
    await SessionAPI.markArrived(playerId);
    document.getElementById('tabPanel').innerHTML = await rosterTabHtml();
    // Manual mode never auto-fills courts — the host builds every match
    // by hand from the live cards, so arrivals just sit in Late Arrivals.
    // Automated mode: only auto-fill AFTER the host has started queuing
    // (pressed Shuffle). Before that, arrivals just sit in the waiting
    // list so the host can shuffle/balance them all at once.
    if (!isManualMode && _queueStarted && activeTab === 'roster') {
      const courts = await SessionAPI.getCourts(activeSession.id);
      for (const court of courts) {
        if (court.status === 'open') {
          try { await SessionAPI.tryRefillCourt(court.id, activeSession.id); }
          catch (e) { /* non-fatal */ }
        }
      }
      document.getElementById('tabPanel').innerHTML = await rosterTabHtml();
    }
  } catch (err) { alert(err.message || 'Could not mark as arrived.'); }
  finally { uiGuardEnd('arrived-' + playerId); }
}

let _paddleGripCounter = 0;
// iStackyyy brand paddle — teal-cyan gradient frame with a rounded,
// tapered head (matching the official logo), thin ring accents echoing
// the logo's target motif, a soft glow, and "iStackyyy" lettering on the
// grip. Keeps the EXACT SAME 48×64 coordinate space as before, so
// .paddle-face's percentage-based positioning still lines up perfectly —
// only what's drawn changed, not the geometry the photo/initials sit in.
// Four real pickleball paddle head shapes, each with its own outline and a
// matching face-fill geometry so the photo/initials fill nearly the WHOLE
// face regardless of which shape a player gets — only a thin frame shows.
// Shape is picked once per player (deterministic hash of their name, same
// technique as colorFromName) so it never flickers between renders.
const PADDLE_SHAPES = {
  widebody: {
    head: `<rect x="1" y="0" width="46" height="50" rx="15"/>`,
    face: { top: '4.7%', left: '8.3%', width: '83.3%', height: '68.75%', radius: '24%' },
  },
  hybrid: {
    head: `<rect x="5" y="0" width="38" height="51" rx="13"/>`,
    face: { top: '4.7%', left: '16.7%', width: '66.7%', height: '70.3%', radius: '23%' },
  },
  elongated: {
    head: `<rect x="9" y="-1" width="30" height="53" rx="11"/>`,
    face: { top: '4.7%', left: '25%', width: '50%', height: '73.4%', radius: '22%' },
  },
  oblong: {
    head: `<path d="M24 1 C35 1,46 8,46 24 C46 40,38 51,24 51 C10 51,2 40,2 24 C2 8,13 1,24 1 Z"/>`,
    face: { top: '4.7%', left: '10.4%', width: '79.2%', height: '73.4%', radius: '50%' },
  },
};
function pickPaddleShape(name) {
  const s = String(name || '?');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 17 + s.charCodeAt(i)) % 97;
  const keys = Object.keys(PADDLE_SHAPES);
  return keys[h % keys.length];
}

function paddleSvg(shapeKey) {
  const shape = PADDLE_SHAPES[shapeKey] || PADDLE_SHAPES.oblong;
  const gid = `pg${_paddleGripCounter++}`; // unique gradient/pattern/glow ids per call
  return `<svg viewBox="0 0 48 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="${gid}-frame" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0B6E7A"/>
        <stop offset="45%" stop-color="#17B8C4"/>
        <stop offset="100%" stop-color="#7CEAF0"/>
      </linearGradient>
      <linearGradient id="${gid}-grip" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#12838F"/>
        <stop offset="100%" stop-color="#0A4B54"/>
      </linearGradient>
      <!-- Overgrip spiral-wrap texture — diagonal ridge pattern, like a
           real grip tape wound around the handle -->
      <pattern id="${gid}-overgrip" width="4.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(58)">
        <rect width="4.2" height="4.2" fill="transparent"/>
        <rect width="4.2" height="2.1" fill="#0E5C66" fill-opacity="0.55"/>
      </pattern>
      <filter id="${gid}-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.1" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Head — one of 4 real paddle shapes (widebody/hybrid/elongated/oblong) -->
    <g fill="url(#${gid}-frame)" stroke="#BFF8FC" stroke-width="0.6" stroke-opacity="0.7" filter="url(#${gid}-glow)">
      ${shape.head}
    </g>

    <!-- Grip: base gradient + overgrip spiral texture on top -->
    <rect x="18.5" y="45" width="11" height="19" rx="3.5" fill="url(#${gid}-grip)"/>
    <rect x="18.5" y="45" width="11" height="19" rx="3.5" fill="url(#${gid}-overgrip)"/>
    <rect x="18.5" y="45" width="11" height="19" rx="3.5" fill="none" stroke="#BFF8FC" stroke-opacity="0.4" stroke-width="0.5"/>
  </svg>`;
}

// ============================================================
// PHOTO / AVATAR HELPERS (shared)
// ============================================================
// Deterministic color from a name — same name → same color, always.
function colorFromName(name) {
  const s = String(name || '?');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  // Pleasant, saturated but not neon; consistent lightness for contrast with white text.
  return `hsl(${h}, 52%, 42%)`;
}
function initialsFromName(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
// Face for a paddle: photo if present, else initials on name-color circle.
// Sized/shaped per the paddle's own head shape so it fills nearly the
// whole face regardless of which of the 4 shapes this player got.
function paddleFaceHtml(name, photoUrl, shapeKey) {
  const shape = PADDLE_SHAPES[shapeKey] || PADDLE_SHAPES.oblong;
  const f = shape.face;
  const styleBase = `top:${f.top};left:${f.left};width:${f.width};height:${f.height};border-radius:${f.radius};`;
  if (photoUrl) return `<div class="paddle-face" style="${styleBase}"><img src="${photoUrl}" alt=""></div>`;
  return `<div class="paddle-face" style="${styleBase}background:${colorFromName(name)}"><span class="initials">${initialsFromName(name)}</span></div>`;
}
// Paddle chip with photo-face + name OUTSIDE below it. Accepts a player object.
function paddleChipHost(player) {
  const name = typeof player === 'string' ? player : (player?.name || '—');
  const photo = typeof player === 'string' ? null : (player?.photo_url || null);
  const shapeKey = pickPaddleShape(name);
  return `<div class="court-host-paddle">
    <div class="court-host-paddle-shape">${paddleSvg(shapeKey)}${paddleFaceHtml(name, photo, shapeKey)}</div>
    <span class="paddle-name-out">${escapeHtml(name)}</span>
  </div>`;
}

// Compress an image File to a small square JPEG data URL (~256px, quality 0.7).
// Keeps base64 payloads well under ~80KB so they fit comfortably in a text column.
function compressImageFile(file, size = 256, quality = 0.7) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) { reject(new Error('Please choose an image file.')); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        // Cover-crop to square (center).
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read that image.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.readAsDataURL(file);
  });
}
// Wire an avatar-upload element: compress + preview + stash into a hidden field.
async function handleAvatarPick(inputEl, targetId, previewEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  try {
    const dataUrl = await compressImageFile(file);
    document.getElementById(targetId).value = dataUrl;
    // previewEl is the inner preview SPAN only — the file/hidden inputs
    // live as siblings outside it, so this never destroys them.
    previewEl.innerHTML = `<img src="${dataUrl}" alt="">`;
  } catch (err) { alert(err.message || 'Could not process image.'); }
}
// Reusable avatar-upload widget markup.
// CRITICAL: the preview (photo/initials) lives in its own inner <span id="preview_...">
// so handleAvatarPick can safely replace ONLY that span's innerHTML without ever
// touching the sibling <input type="file"> or <input type="hidden"> that hold the data.
function avatarUploadWidget(targetId, currentUrl, name) {
  const inner = currentUrl
    ? `<img src="${currentUrl}" alt="">`
    : (name
        ? `<span class="init-fill" style="background:${colorFromName(name)};width:100%;height:100%;display:flex;align-items:center;justify-content:center;">${initialsFromName(name)}</span>`
        : `<span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>PHOTO</span>`);
  return `<label class="avatar-upload" id="wrap_${targetId}">
    <span id="preview_${targetId}" style="display:contents">${inner}</span>
    <input type="file" accept="image/*" onchange="handleAvatarPick(this,'${targetId}',document.getElementById('preview_${targetId}'))">
    <input type="hidden" id="${targetId}" value="${currentUrl || ''}">
  </label>`;
}

function renderCourtDiagramCard(court, players) {

  _prevHostCourtStates[court.id] = { status: court.status, team_a_id: court.team_a_id };

  const footer = isActive ? 'Tap to mark finished' : 'OPEN — waiting for players';

// ============================================================
// STACKING / PAIRING ENGINE
// ============================================================
const TIER_RANK = { beginner: 0, intermediate: 1, advanced: 2, open: -1 };

/**
 * Fisher-Yates shuffle — returns a NEW shuffled array, does not mutate.
 */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Core doubles pairing — given exactly 4 players, returns the best 2v2 split.
 *
 * PRIORITY ORDER (hard, not soft):
 *   1. SKILL BALANCE — always wins. Finds the split where the rank-sum
 *      difference between teams is smallest. If same-tier players exist,
 *      prefers them on OPPOSING sides (intermediate+beginner vs
 *      intermediate+beginner beats intermediate+intermediate vs beginner+beginner).
 *
 *   2. RANDOMIZATION — when multiple splits tie on skill balance (including
 *      all-equal or all-open tiers), the group is shuffled before splitting
 *      so partners are random, not always the first two in queue order.
 *      This is the fix for "player1 always pairs with player6".
 *
 *   3. WIN/LOSS cosmetic — ONLY applies as a label (which side is "Team A")
 *      when 2 winners and 2 losers happen to fall cleanly into the already-
 *      chosen split. It NEVER changes which 2 players are teamed together.
 *      If the best skill split puts a winner and a loser together, that's final.
 *
 * Documented examples:
 *   [inter, inter, beg, beg]  → inter+beg vs inter+beg  (never inter+inter vs beg+beg)
 *   [adv, beg, inter, inter]  → adv+beg vs inter+inter  (extremes cancel out)
 *   [open, open, open, open]  → random 2v2 every time
 */
function decideSkillBalancedTeams(group) {
  if (group.length !== 4) return null;

  // Treat 'open' as intermediate (rank 1) for balancing purposes.
  const ranks = group.map(p => TIER_RANK[p.skill_tier] >= 0 ? TIER_RANK[p.skill_tier] : 1);

  // All 3 unique 2v2 partitions of indices 0-3.
  const splits = [
    { a: [0,1], b: [2,3] },
    { a: [0,2], b: [1,3] },
    { a: [0,3], b: [1,2] },
  ];

  // ── Recent-opponent avoidance ──
  // Don't immediately rematch someone you just played against. This is a
  // SOFT preference: if every possible split would force a rematch (only
  // happens when the pool isn't evenly divisible by 4 and the same players
  // keep circling back), we allow it rather than deadlock the queue.
  function recentOpponentIds(p) {
    return Array.isArray(p.recent_opponent_ids) ? p.recent_opponent_ids : [];
  }
  function rematchCount(s) {
    let count = 0;
    for (const i of s.a) for (const j of s.b) {
      const pi = group[i], pj = group[j];
      if (recentOpponentIds(pi).includes(pj.id) || recentOpponentIds(pj).includes(pi.id)) count++;
    }
    return count;
  }

  // Score each split — LOWER is better.
  // Primary:   rematch count (avoid facing your last opponent at all costs
  //            unless every split forces it — then it's a tie and skill
  //            balance decides).
  // Secondary: absolute rank-sum difference between the two teams.
  // Tertiary:  number of same-tier pairs on the SAME team (0 = spread out).
  function scoreSplit(s) {
    const sumA = s.a.reduce((acc, i) => acc + ranks[i], 0);
    const sumB = s.b.reduce((acc, i) => acc + ranks[i], 0);
    const diff = Math.abs(sumA - sumB);
    const clumped =
      (ranks[s.a[0]] === ranks[s.a[1]] ? 1 : 0) +
      (ranks[s.b[0]] === ranks[s.b[1]] ? 1 : 0);
    return rematchCount(s) * 1000 + diff * 10 + clumped;
  }

  const scores = splits.map(s => scoreSplit(s));
  const best   = Math.min(...scores);

  // Collect ALL splits that tie for best score.
  const bestSplits = splits.filter((_, i) => scores[i] === best);

  // When multiple splits tie (common when all tiers are equal/open, or when
  // rematch-count ties too), pick RANDOMLY among the tied splits themselves
  // — never reshuffle the raw group, since that would re-randomize who
  // faces whom and could silently reintroduce a rematch the scoring above
  // just worked to avoid.
  const chosen = { ...bestSplits[Math.floor(Math.random() * bestSplits.length)], group };

  let teamAIds = chosen.a.map(i => chosen.group[i].id);
  let teamBIds = chosen.b.map(i => chosen.group[i].id);

  // Win/loss cosmetic label only — swap A/B if the losers landed on A side
  // and winners on B, so winners consistently appear as "Team A" in the UI.
  // This NEVER changes the composition of either team, only the A/B label.
  const winnerIds = group.filter(p => p.last_match_result === 'won').map(p => p.id);
  const loserIds  = group.filter(p => p.last_match_result === 'lost').map(p => p.id);
  if (winnerIds.length === 2 && loserIds.length === 2) {
    const aIsLosers = teamAIds.every(id => loserIds.includes(id));
    if (aIsLosers) [teamAIds, teamBIds] = [teamBIds, teamAIds];
  }

  return { teamAPlayerIds: teamAIds, teamBPlayerIds: teamBIds };
}

function decideNextMatchFromPool(players, teamSize) {
  const needed = teamSize * 2;
  if (!players || players.length < needed) return null;
  if (teamSize === 1) {
    return { teamAPlayerIds: [players[0].id], teamBPlayerIds: [players[1].id] };
  }

  // pool is pure FIFO (longest-waiting first). The front player is the
  // ANCHOR — their result type decides how we fill the group of 4:
  //   fresh anchor  → take the next 4 players regardless of result
  //                   (a clean fresh group plays; a winner/loser only
  //                    gets pulled in if the fresh run is shorter than 4).
  //   winner anchor → group with other winners first, then backfill with
  //                   FRESH players. Never pull in losers.
  //   loser anchor  → group with other losers first, then backfill with
  //                   FRESH players. Never pull in winners.
  // This gives: waiting fresh play together while they last; once fresh
  // run out, waiting winners grab fresh late-arrivals to complete their
  // group (and losers likewise) — winning/losing pairs never mix.
  const anchor = players[0];
  const anchorResult = anchor.last_match_result || null; // 'won' | 'lost' | null

  const isFresh  = p => !p.last_match_result;
  const sameSide = p => p.last_match_result === anchorResult;

  let group;
  if (!anchorResult) {
    // Fresh anchor — pure FIFO, next 4 whoever they are.
    group = players.slice(0, needed);
  } else {
    // Winner/loser anchor: same-side players first (FIFO), then fresh fill.
    const sameSidePlayers = players.filter(sameSide);
    const freshPlayers    = players.filter(isFresh);
    group = [...sameSidePlayers, ...freshPlayers].slice(0, needed);
    // If still short (not enough same-side + fresh), fall back to raw FIFO.
    if (group.length < needed) group = players.slice(0, needed);
  }
  if (group.length < needed) return null;

  // WINNING PAIR vs WINNING PAIR (and losing pair vs losing pair):
  // teammates from the same finished match share an identical
  // became_free_at timestamp. If the group is all one result type and
  // forms exactly two timestamp-pairs, keep each pair together.
  const allSameResult = group.every(p => p.last_match_result === 'won') ||
                        group.every(p => p.last_match_result === 'lost');
  if (allSameResult) {
    const byTs = {};
    for (const p of group) {
      const k = p.became_free_at || '';
      (byTs[k] = byTs[k] || []).push(p);
    }
    const pairs = Object.values(byTs);
    if (pairs.length === 2 && pairs[0].length === 2 && pairs[1].length === 2) {
      return {
        teamAPlayerIds: pairs[0].map(p => p.id),
        teamBPlayerIds: pairs[1].map(p => p.id),
      };
    }
  }

  return decideSkillBalancedTeams(group);
}

window.StackingEngine = { decideNextMatchFromPool, TIER_RANK };

// ============================================================
// PASSWORD UTILITY
// ============================================================
async function hashPassword(plainText) {
  const data = new TextEncoder().encode(plainText);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function generateReferenceCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return `STACK-${code}`;
}

// ============================================================
// SESSION API  (pure-automated edition)
// ============================================================
const SessionAPI = (() => {

  async function createSession({ name, format, courtCount, sessionType, category, division, bestOf, restPriorityEnabled, deuceEnabled, pairingMode }) {
    if (!currentHost?.id) {
      throw new Error('Not logged in — please log out and sign in again.');
    }
    let session, error;
    for (let attempt = 0; attempt < 5; attempt++) {
      const referenceCode = generateReferenceCode();
      // Only insert columns that are guaranteed to exist on every deployment.
      // Tournament metadata (category, division) lives on the brackets table,
      // not on sessions — keeping sessions lean avoids missing-column errors.
      const insertRow = {
        name,
        format,
        court_count: courtCount,
        stacking_mode: 'win_loss_queue',
        pairing_default: 'fixed',
        skill_match_mode: 'open',
        rest_priority_enabled: restPriorityEnabled !== false,
        allow_cross_lane_fill: true,
        password_hash: null,
        session_type: sessionType || 'open_play',
        open_play_mode: sessionType === 'open_play' ? (pairingMode === 'manual' ? 'manual' : 'automated') : null,
        scoring_mode: 'win_loss',
        points_to_win: 11,
        deuce_enabled: deuceEnabled !== false,
        reference_code: referenceCode,
        host_id: currentHost.id,
      };
      const result = await supabaseClient
        .from('sessions')
        .insert(insertRow)
        .select().single();
      session = result.data;
      error = result.error;
      if (error && /open_play_mode/.test(error.message || '')) {
        // Migration not run yet — create the session without this column
        // rather than blocking session creation entirely. Falls back to
        // automated pairing behavior everywhere that reads this field.
        const fallbackRow = { ...insertRow };
        delete fallbackRow.open_play_mode;
        const retryResult = await supabaseClient.from('sessions').insert(fallbackRow).select().single();
        session = retryResult.data;
        error = retryResult.error;
      }
      if (!error) break;
      if (error.code !== '23505') break;
    }
    if (error) throw error;

    const courtRows = Array.from({ length: courtCount }, (_, i) => ({
      session_id: session.id, court_number: i + 1, status: 'open',
    }));
    const { error: courtError } = await supabaseClient.from('courts').insert(courtRows);
    if (courtError) throw courtError;

    // Store tournament metadata on the session object in memory for the UI,
    // even if the DB doesn't have those columns yet.
    session._meta = { sessionType, category, division };
    return session;
  }

  async function getSession(sessionId) {
    const { data, error } = await supabaseClient.from('sessions').select('*').eq('id', sessionId).single();
    if (error) throw error;
    return data;
  }

  async function getSessionByReferenceCode(code) {
    const normalized = code.trim().toUpperCase();
    const { data, error } = await supabaseClient.from('sessions').select('*').eq('reference_code', normalized).single();
    if (error) throw error;
    return data;
  }

  async function getMySessions() {
    if (!currentHost?.id) return [];
    const { data, error } = await supabaseClient
      .from('sessions').select('*')
      .eq('host_id', currentHost.id)
      .order('created_at', { ascending: false });
    if (error) throw error;
    // Hard block: if a permission is currently off, sessions of that type
    // are completely hidden — not just blocked from creating new ones.
    // Undefined (migration not run yet) defaults to true, same as the DB
    // column default, so nothing changes until the SQL is run.
    const allowOpenPlay   = currentHost.allow_open_play !== false;
    const allowTournament = currentHost.allow_tournament !== false;
    return (data || []).filter(s =>
      s.session_type === 'tournament' ? allowTournament : allowOpenPlay
    );
  }

  async function verifySessionPassword(sessionId, password) {
    const session = await getSession(sessionId);
    if (!session.password_hash) return true;
    const hash = await hashPassword(password);
    return hash === session.password_hash;
  }

  async function finishSession(sessionId) {
    const { error } = await supabaseClient.from('sessions').update({ status: 'completed', ended_at: new Date().toISOString() }).eq('id', sessionId);
    if (error) throw error;
  }

  // ---------- PLAYER MANAGEMENT ----------

  /**
   * Pre-register a player as 'expected' — they're on the list but haven't
   * physically arrived yet. No queue placement, no became_free_at.
   * Rejects duplicate names (case-insensitive) within the same session.
   */
  async function preRegisterPlayer(sessionId, name, skillTier = 'open', photoUrl = null, notes = null) {
    // Check for an existing player with the same name in this session.
    // We do this client-side because Supabase doesn't expose a
    // case-insensitive unique constraint easily without a migration.
    const { data: existing } = await supabaseClient.from('players')
      .select('id, name').eq('session_id', sessionId).neq('status', 'left');
    const nameLower = name.trim().toLowerCase();
    const clash = (existing || []).find(p => p.name.trim().toLowerCase() === nameLower);
    if (clash) throw new Error(`"${clash.name}" is already on the list.`);

    const row = { session_id: sessionId, name: name.trim(), skill_tier: skillTier, status: 'expected' };
    if (photoUrl) row.photo_url = photoUrl;
    if (notes)    row.notes = notes.trim();
    const { data, error } = await supabaseClient.from('players').insert(row).select().single();
    if (error) {
      // If the photo_url/notes columns don't exist yet, retry without them
      // so player registration still works (those fields just won't save).
      if (/photo_url|notes/.test(error.message || '')) {
        delete row.photo_url;
        delete row.notes;
        const retry = await supabaseClient.from('players').insert(row).select().single();
        if (retry.error) throw retry.error;
        return retry.data;
      }
      throw error;
    }
    return data;
  }

  // Edit an existing player's name, tier, photo, and/or notes.
  async function updatePlayer(playerId, { name, skillTier, photoUrl, notes } = {}) {
    const row = {};
    if (name != null)     row.name = name.trim();
    if (skillTier != null) row.skill_tier = skillTier;
    if (photoUrl != null)  row.photo_url = photoUrl;
    if (notes != null)     row.notes = notes.trim();
    const { data, error } = await supabaseClient.from('players').update(row).eq('id', playerId).select().single();
    if (error) {
      if (/photo_url|notes/.test(error.message || '')) {
        delete row.photo_url;
        delete row.notes;
        const retry = await supabaseClient.from('players').update(row).eq('id', playerId).select().single();
        if (retry.error) throw retry.error;
        return retry.data;
      }
      throw error;
    }
    return data;
  }

  /**
   * Mark a player as arrived — sets status 'waiting' and stamps
   * became_free_at NOW (their check-in time). 'waiting' + no
   * last_match_result yet is what the Manual Mode board reads as
   * "Late Arrival" (see manualBoardHtml) — deliberately NOT a separate
   * status value, since the players table's CHECK constraint only allows
   * a fixed set of statuses and 'late_arrival' isn't one of them.
   * Manual mode's actual difference from automated is behavioral, not
   * data-shaped: callers skip the auto-refill-courts step for manual
   * sessions (see handleArrived / applyQueuePlacement).
   */
  async function markArrived(playerId) {
    const { error } = await supabaseClient.from('players')
      .update({ status: 'waiting', became_free_at: new Date().toISOString() })
      .eq('id', playerId);
    if (error) throw error;
  }

  async function getAllPlayersIncludingLeft(sessionId) {
    const { data, error } = await supabaseClient.from('players').select('*')
      .eq('session_id', sessionId).order('joined_at', { ascending: true });
    if (error) throw error;
    return data;
  }

  async function getPlayers(sessionId) {
    // Active players: everyone except 'left'. Includes 'expected' (pre-registered)
    // and 'resting' — the queue engine filters those out by checking status directly.
    const { data, error } = await supabaseClient.from('players').select('*')
      .eq('session_id', sessionId).neq('status', 'left').order('joined_at', { ascending: true });
    if (error) throw error;
    return data;
  }

  async function removePlayer(playerId) {
    const { data: player } = await supabaseClient.from('players')
      .select('status, session_id').eq('id', playerId).single();
    if (!player) throw new Error('Player not found.');

    if (player.status === 'playing') {
      // Mid-match leave: flag them as 'left' now. The court keeps running —
      // we don't pull anyone off a live game. When the match ends and
      // applyQueuePlacement runs, it checks each player's current status;
      // anyone already 'left' is skipped and stays left instead of being
      // pushed back to the queue.
      await supabaseClient.from('players').update({ status: 'left' }).eq('id', playerId);
      return;
    }

    // Not mid-match — deactivate any waiting team they were part of.
    const activeTeams = await getTeams(player.session_id);
    const theirTeam = activeTeams.find(t => t.player_ids.includes(playerId) && t.queue_lane !== 'playing');
    if (theirTeam) {
      await supabaseClient.from('teams').update({ is_active: false }).eq('id', theirTeam.id);
    }
    const { error } = await supabaseClient.from('players').update({ status: 'left' }).eq('id', playerId);
    if (error) throw error;
  }

  async function restPlayerNow(playerId, sessionId) {
    const activeTeams = await getTeams(sessionId);
    const theirTeam = activeTeams.find(t => t.player_ids.includes(playerId) && t.queue_lane !== 'playing');
    if (theirTeam) {
      await supabaseClient.from('teams').update({ is_active: false }).eq('id', theirTeam.id);
    }
    // became_free_at doubles as "entered current status at" — stamping it
    // here is what lets the Resting card show a live "Resting Xm" timer.
    await supabaseClient.from('players')
      .update({ status: 'resting', became_free_at: new Date().toISOString() }).eq('id', playerId);
  }

  // Swaps ONE player on a team for a substitute — used both for an active
  // court mid-match and for a queued-but-not-yet-started team. This is the
  // single place that changes team.player_ids for a substitution, so stat
  // crediting downstream (logMatchResult re-reads player_ids fresh at
  // match-completion time) automatically follows whoever is CURRENTLY on
  // the team — the substitute gets credit for however the match turns out,
  // the departed player doesn't, with no special-casing needed anywhere
  // else. The departed player's status is set exactly once, to exactly
  // one value (resting/left) — never left dangling at 'playing' while
  // also not actually on any team, which is the core invariant this
  // whole feature exists to protect.
  async function swapPlayerOnTeam(teamId, oldPlayerId, newPlayerId, departingDisposition) {
    const { data: team, error: teamErr } = await supabaseClient.from('teams').select('*').eq('id', teamId).single();
    if (teamErr || !team) throw new Error('Team not found.');
    if (!team.player_ids.includes(oldPlayerId)) throw new Error('That player is not on this team.');

    const { data: incoming, error: pErr } = await supabaseClient.from('players').select('*').eq('id', newPlayerId).single();
    if (pErr || !incoming) throw new Error('Substitute player not found.');
    if (incoming.status === 'playing') throw new Error('That player is already on a court.');

    const newPlayerIds = team.player_ids.map(id => id === oldPlayerId ? newPlayerId : id);
    const { error: updErr } = await supabaseClient.from('teams').update({ player_ids: newPlayerIds }).eq('id', teamId);
    if (updErr) throw updErr;

    // Departed player: exactly one clean status, never 'playing' anymore
    // and never left without a home. 'left' matches removePlayer's
    // existing mid-match pattern (flag only, no other side effects).
    if (departingDisposition === 'rest') {
      await supabaseClient.from('players')
        .update({ status: 'resting', became_free_at: new Date().toISOString() }).eq('id', oldPlayerId);
    } else {
      await supabaseClient.from('players').update({ status: 'left' }).eq('id', oldPlayerId);
    }

    // Incoming player: only mark 'playing' if the team they're joining is
    // actually live on a court right now — a queued (not-yet-started) team
    // shouldn't make its new player look like they're already on court.
    const { data: liveCourts } = await supabaseClient.from('courts')
      .select('id').eq('status', 'in_progress').or(`team_a_id.eq.${teamId},team_b_id.eq.${teamId}`);
    const onLiveCourt = !!(liveCourts && liveCourts.length);
    await supabaseClient.from('players')
      .update({ status: onLiveCourt ? 'playing' : 'waiting' }).eq('id', newPlayerId);

    return { newPlayerIds };
  }

  async function restPlayerManually(playerId) {
    const { data: player, error } = await supabaseClient.from('players').select('*').eq('id', playerId).single();
    if (error || !player) throw new Error('Could not find this player.');
    if (player.status === 'playing') throw new Error('Player is mid-match — rest them after their game ends.');
    if (player.status === 'expected') throw new Error('Player hasn\'t arrived yet.');
    await restPlayerNow(playerId, player.session_id);
  }

  async function returnToQueue(playerId) {
    const { data: player } = await supabaseClient.from('players').select('status, session_id').eq('id', playerId).single();
    if (!player) throw new Error('Player not found.');
    if (player.status === 'playing') throw new Error('Player is mid-match — they rejoin the queue automatically when their game ends.');

    // Stats (wins, losses, total_games_played, total_points) are NEVER wiped
    // by rest or leave — they stay on the row the whole time. Setting status
    // back to 'waiting' is enough to make them reappear in getPlayers(),
    // the leaderboard, and the queue. No stat restoration needed.
    //
    // became_free_at = now puts them at the BACK of the FIFO queue (fair —
    // they stepped out voluntarily, others have been waiting).
    await supabaseClient.from('players')
      .update({ status: 'waiting', became_free_at: new Date().toISOString() })
      .eq('id', playerId);
  }

  // ---------- TEAM / COURT ----------

  async function createTeam(sessionId, playerIds, lane = 'waiting') {
    const { data, error } = await supabaseClient.from('teams')
      .insert({ session_id: sessionId, player_ids: playerIds, pairing_mode: 'fixed', queue_lane: lane, queue_position: 0, is_active: true })
      .select().single();
    if (error) throw error;
    return data;
  }

  async function getTeams(sessionId) {
    const { data, error } = await supabaseClient.from('teams').select('*').eq('session_id', sessionId).eq('is_active', true);
    if (error) throw error;
    return data;
  }

  async function getCourts(sessionId) {
    const { data, error } = await supabaseClient.from('courts')
      .select('*, team_a:team_a_id(*), team_b:team_b_id(*)')
      .eq('session_id', sessionId).order('court_number', { ascending: true });
    if (error) throw error;
    return data;
  }

  async function assignCourt(courtId, teamAId, teamBId) {
    const { data: updated, error } = await supabaseClient.from('courts')
      .update({ status: 'in_progress', team_a_id: teamAId, team_b_id: teamBId, game_started_at: new Date().toISOString() })
      .eq('id', courtId).neq('status', 'in_progress').select();
    if (error) throw error;
    if (!updated || updated.length === 0) throw new Error('Court was just taken. Refresh and try again.');

    const { data: teamRows } = await supabaseClient.from('teams').select('player_ids').in('id', [teamAId, teamBId]);
    await supabaseClient.from('teams').update({ queue_lane: 'playing', queue_position: null }).in('id', [teamAId, teamBId]);
    if (teamRows) {
      const allPlayerIds = teamRows.flatMap(t => t.player_ids);
      await supabaseClient.from('players').update({ status: 'playing' }).in('id', allPlayerIds);
    }
  }

  async function logMatchResult(courtId, winnerTeamId, loserScore, deuceEnabled = true) {
    // loserScore: integer the losing team scored.
    // Deuce ON  → winner = loserScore+2 when loserScore>=10, else 11.
    // Deuce OFF → winner is always 11 (loser capped at 10 by the input).
    const winnerScore = (deuceEnabled && loserScore >= 10) ? loserScore + 2 : 11;

    const { data: court, error } = await supabaseClient.from('courts').select('*').eq('id', courtId).single();
    if (error) throw error;

    const loserTeamId = court.team_a_id === winnerTeamId ? court.team_b_id : court.team_a_id;

    // Determine which score belongs to team_a vs team_b for the DB row.
    const teamAScore = court.team_a_id === winnerTeamId ? winnerScore : loserScore;
    const teamBScore = court.team_b_id === winnerTeamId ? winnerScore : loserScore;

    // Update individual player stats.
    const { data: teamRows } = await supabaseClient.from('teams')
      .select('id, player_ids').in('id', [court.team_a_id, court.team_b_id]);

    if (teamRows) {
      const winnerRow = teamRows.find(t => t.id === winnerTeamId);
      const loserRow  = teamRows.find(t => t.id === loserTeamId);

      if (winnerRow) {
        const { data: winPlayers } = await supabaseClient.from('players')
          .select('id, wins, total_games_played, total_points').in('id', winnerRow.player_ids);
        for (const p of winPlayers || []) {
          await supabaseClient.from('players').update({
            wins: (p.wins || 0) + 1,
            total_games_played: (p.total_games_played || 0) + 1,
            total_points: (p.total_points || 0) + winnerScore,
          }).eq('id', p.id);
        }
      }
      if (loserRow) {
        const { data: losePlayers } = await supabaseClient.from('players')
          .select('id, losses, total_games_played, total_points').in('id', loserRow.player_ids);
        for (const p of losePlayers || []) {
          await supabaseClient.from('players').update({
            losses: (p.losses || 0) + 1,
            total_games_played: (p.total_games_played || 0) + 1,
            total_points: (p.total_points || 0) + loserScore,
          }).eq('id', p.id);
        }
      }
    }

    await supabaseClient.from('matches').insert({
      session_id: court.session_id, court_id: courtId,
      team_a_id: court.team_a_id, team_b_id: court.team_b_id,
      winner_team_id: winnerTeamId,
      team_a_score: teamAScore, team_b_score: teamBScore,
      score_visible: true,
      started_at: court.game_started_at,
      ended_at: new Date().toISOString(),
      duration_seconds: court.game_started_at
        ? Math.round((Date.now() - new Date(court.game_started_at).getTime()) / 1000) : null,
    });
    return court;
  }

  /**
   * Apply individual post-match disposition for all players on this court.
   *
   * @param {string} courtId
   * @param {string} sessionId
   * @param {Array}  decisions  — [{ playerId, outcome, wasWinner }]
   *                  outcome: 'queue' | 'rest' | 'left'
   *                  wasWinner: boolean — determines FIFO timestamp offset
   *
   * Players pre-flagged as 'left' mid-match (via removePlayer while playing)
   * keep their 'left' status regardless of the decision passed here — the
   * decision modal initialises them as 'left' and locks that choice.
   */
  async function applyQueuePlacement(courtId, sessionId, decisions, winnerTeamId, loserTeamId) {
    const nowMs = Date.now();
    // Winners rejoin 1ms ahead of losers — preserves FIFO ordering within
    // the returning group (see original comment in this function).
    const tsWinner = new Date(nowMs).toISOString();
    const tsLoser  = new Date(nowMs + 1).toISOString();

    // Idempotency guard: if this exact court no longer has THESE two teams
    // on it, someone already processed this disposition (a duplicate
    // submit, or a retry after a misleading error) — bail out instead of
    // deactivating whatever team happens to be on the court NOW. That team
    // could belong to a completely different, already-in-progress match;
    // deactivating it without resetting ITS players' status is exactly
    // what orphans people at status='playing' with no way back to the
    // queue and no disposition ever offered to them.
    if (winnerTeamId && loserTeamId) {
      const { data: courtNow } = await supabaseClient.from('courts')
        .select('team_a_id, team_b_id').eq('id', courtId).single();
      const stillOurs = courtNow && (
        (courtNow.team_a_id === winnerTeamId && courtNow.team_b_id === loserTeamId) ||
        (courtNow.team_a_id === loserTeamId  && courtNow.team_b_id === winnerTeamId)
      );
      if (!stillOurs) return; // already handled by an earlier call — nothing more to do
    }

    // Recent-opponent tracking: each player's "who did I just face" list is
    // the OTHER side's player ids from this match — used by the stacking
    // engine to avoid an immediate rematch next time a court frees up.
    const winnerIdsThisMatch = decisions.filter(d => d.wasWinner).map(d => d.playerId);
    const loserIdsThisMatch  = decisions.filter(d => !d.wasWinner).map(d => d.playerId);

    for (const { playerId, outcome, wasWinner } of decisions) {
      // Re-fetch to check if they were pre-flagged left mid-match.
      const { data: current } = await supabaseClient.from('players')
        .select('status').eq('id', playerId).single();
      if (current?.status === 'left') continue; // respect pre-flagged leave

      const ts = wasWinner ? tsWinner : tsLoser;
      const lastResult = wasWinner ? 'won' : 'lost';
      const opponentIds = wasWinner ? loserIdsThisMatch : winnerIdsThisMatch;

      let row;
      if (outcome === 'queue') {
        row = { status: 'waiting', became_free_at: ts, last_match_result: lastResult, recent_opponent_ids: opponentIds, pending_disposition: null };
      } else if (outcome === 'rest') {
        row = { status: 'resting', became_free_at: ts, last_match_result: lastResult, recent_opponent_ids: opponentIds, pending_disposition: null };
      } else if (outcome === 'left') {
        row = { status: 'left', last_match_result: lastResult, recent_opponent_ids: opponentIds, pending_disposition: null };
      } else {
        continue;
      }

      // CRITICAL: recent_opponent_ids and pending_disposition each require
      // their own migration the host may not have run yet. If either
      // column is missing, Postgres rejects the WHOLE update (status/
      // timestamp included) — so retry without them rather than silently
      // breaking the core queue-placement flow.
      let { error } = await supabaseClient.from('players').update(row).eq('id', playerId);
      if (error && /pending_disposition/i.test(error.message || '')) {
        delete row.pending_disposition;
        ({ error } = await supabaseClient.from('players').update(row).eq('id', playerId));
      }
      if (error && /recent_opponent_ids/.test(error.message || '')) {
        delete row.recent_opponent_ids;
        await supabaseClient.from('players').update(row).eq('id', playerId);
      }
    }

    // Deactivate the EXACT teams from THIS match — never re-query the
    // court's current team ids for this. By the time this line runs, the
    // court could already have been reassigned to a brand new match (see
    // the idempotency guard above); re-querying here was the original bug.
    const teamIdsToDeactivate = [winnerTeamId, loserTeamId].filter(Boolean);
    if (teamIdsToDeactivate.length) {
      await supabaseClient.from('teams').update({ is_active: false }).in('id', teamIdsToDeactivate);
    } else {
      // Backward-compatible fallback if this was ever called without team
      // ids — keeps old behavior rather than silently doing nothing.
      const { data: court } = await supabaseClient.from('courts')
        .select('team_a_id, team_b_id').eq('id', courtId).single();
      if (court) {
        await supabaseClient.from('teams').update({ is_active: false })
          .in('id', [court.team_a_id, court.team_b_id]);
      }
    }
    await supabaseClient.from('courts')
      .update({ status: 'open', team_a_id: null, team_b_id: null, game_started_at: null })
      .eq('id', courtId);

    // A lost race here (a concurrent realtime-triggered refill claims this
    // court first) is NOT a failure of the disposition itself — the player
    // updates and team deactivation above already succeeded. Swallow it so
    // the host never sees a misleading "something went wrong, try again"
    // that would tempt a duplicate submit — which is exactly what causes
    // orphaned players if it ever gets through.
    // Manual-mode sessions never auto-pair — release the oldest prepared
    // ("Up Next") match instead of running the automated stacking engine.
    try {
      const freedSession = sessionId ? await getSession(sessionId) : null;
      if (freedSession?.open_play_mode === 'manual') {
        await tryReleasePreparedMatch(courtId, sessionId);
      } else {
        await tryRefillCourt(courtId, sessionId);
      }
    } catch (_) {}

    // Safety net: clean up any players stuck at status='playing' with no
    // live court actually linked to them — whatever the cause, this keeps
    // the roster accurate without the host having to manually intervene.
    try { await reconcileOrphanedPlayers(sessionId); } catch (_) {}
  }

  // Finds players stuck at status='playing' who aren't actually on ANY
  // live court's team right now, and returns them to the waiting queue.
  // Acts as a backstop regardless of exactly how a player got orphaned.
  async function reconcileOrphanedPlayers(sessionId) {
    const [{ data: playingPlayers }, { data: liveCourts }] = await Promise.all([
      supabaseClient.from('players').select('id').eq('session_id', sessionId).eq('status', 'playing'),
      supabaseClient.from('courts').select('team_a_id, team_b_id').eq('session_id', sessionId).eq('status', 'in_progress'),
    ]);
    if (!playingPlayers || !playingPlayers.length) return 0;
    const liveTeamIds = (liveCourts || []).flatMap(c => [c.team_a_id, c.team_b_id]).filter(Boolean);
    let trulyPlayingIds = new Set();
    if (liveTeamIds.length) {
      const { data: liveTeams } = await supabaseClient.from('teams').select('player_ids').in('id', liveTeamIds);
      trulyPlayingIds = new Set((liveTeams || []).flatMap(t => t.player_ids));
    }
    const orphaned = playingPlayers.filter(p => !trulyPlayingIds.has(p.id));
    if (orphaned.length) {
      await supabaseClient.from('players')
        .update({ status: 'waiting', became_free_at: new Date().toISOString() })
        .in('id', orphaned.map(p => p.id));
    }
    return orphaned.length;
  }

  /**
   * START QUEUING — randomize the order of all currently-waiting players.
   * Assigns staggered timestamps in shuffled order, then fills every open
   * court. Players arriving after this get became_free_at = now, which is
   * later than every shuffled timestamp → they join the back of the queue.
   */
  async function shuffleQueue(sessionId) {
    const { data: waiting } = await supabaseClient.from('players')
      .select('id, skill_tier').eq('session_id', sessionId).eq('status', 'waiting');
    if (!waiting || waiting.length === 0) return 0;

    // CATEGORY-BALANCED SHUFFLE:
    // Group players by skill tier, shuffle WITHIN each tier, then lay the
    // tiers back-to-back in the queue. Because courts fill 4 at a time from
    // the front, adjacent same-tier players naturally produce
    // beginner-vs-beginner / intermediate-vs-intermediate / adv-vs-adv
    // matchups when the counts allow. Where a tier doesn't divide evenly,
    // the leftover players sit next to the neighbouring tier and the
    // skill-balancing engine handles the mixed group of 4.
    const TIER_ORDER = ['beginner', 'intermediate', 'advanced', 'open'];
    const byTier = {};
    for (const p of waiting) {
      const t = p.skill_tier || 'open';
      (byTier[t] = byTier[t] || []).push(p);
    }
    const ordered = [];
    // Known tiers first, in a sensible order; any unknown tiers appended after.
    const seen = new Set();
    for (const t of TIER_ORDER) {
      if (byTier[t]) { ordered.push(...shuffleArray(byTier[t])); seen.add(t); }
    }
    for (const t of Object.keys(byTier)) {
      if (!seen.has(t)) ordered.push(...shuffleArray(byTier[t]));
    }

    // Stagger timestamps in the past so late arrivals (= now) queue behind.
    const base = Date.now() - ordered.length * 10 - 1000;
    for (let i = 0; i < ordered.length; i++) {
      await supabaseClient.from('players')
        .update({ became_free_at: new Date(base + i * 10).toISOString() })
        .eq('id', ordered[i].id);
    }

    // Fill every open court from the freshly ordered queue.
    const { data: courts } = await supabaseClient.from('courts')
      .select('id, status').eq('session_id', sessionId).eq('status', 'open')
      .order('court_number', { ascending: true });
    for (const c of courts || []) {
      await tryRefillCourt(c.id, sessionId);
    }
    return ordered.length;
  }

  async function tryRefillCourt(courtId, sessionId) {
    const { data: court } = await supabaseClient.from('courts').select('*').eq('id', courtId).single();
    if (!court || court.status === 'in_progress') return null;

    const session = sessionId ? await getSession(sessionId) : await getSession(court.session_id);

    // Pull everyone who is 'waiting' — single unified pool.
    // TIERED ORDER (professional stacking):
    //   Tier 0: last match WON      — winners group to the front
    //   Tier 1: fresh / no result   — new arrivals next
    //   FIFO by became_free_at — the longest-waiting player is always next.
    //   Shuffled arrivals get old timestamps (front); late arrivals get
    //   now (back); winners get now; losers get now+1ms.
    // Result (won/lost/fresh) is used ONLY to avoid mixing winners with
    // losers when a clean group can be formed — NOT to jump the queue.
    let { data: rawPool, error: poolErr } = await supabaseClient.from('players')
      .select('id, became_free_at, last_match_result, skill_tier, recent_opponent_ids')
      .eq('session_id', court.session_id)
      .eq('status', 'waiting')
      .order('became_free_at', { ascending: true });
    // Graceful fallback if the recent-opponent-avoidance migration hasn't
    // been run yet — refill still works, it just can't avoid rematches.
    if (poolErr && /recent_opponent_ids/.test(poolErr.message || '')) {
      const retry = await supabaseClient.from('players')
        .select('id, became_free_at, last_match_result, skill_tier')
        .eq('session_id', court.session_id)
        .eq('status', 'waiting')
        .order('became_free_at', { ascending: true });
      rawPool = retry.data;
    }

    let pool = (rawPool || []).slice().sort((a, b) =>
      new Date(a.became_free_at) - new Date(b.became_free_at));

    // ── Loser-starvation safety valve ──
    // If the longest-waiting loser has been in the queue beyond the
    // threshold (default 12 min) and can't form their own group, pull them
    // to the very front for this fill so they don't wait forever.
    const STARVE_MS = 12 * 60 * 1000;
    const losers = pool.filter(p => p.last_match_result === 'lost');
    const nonLosers = pool.filter(p => p.last_match_result !== 'lost');
    if (losers.length > 0 && losers.length < 4) {
      const oldestLoserAge = Date.now() - new Date(losers[0].became_free_at).getTime();
      if (oldestLoserAge >= STARVE_MS) {
        pool = [...losers, ...nonLosers];
      }
    }

    const teamSize = session.format === 'doubles' ? 2 : 1;
    const decision = window.StackingEngine.decideNextMatchFromPool(pool || [], teamSize);
    if (!decision) return null;

    const teamA = await createTeam(court.session_id, decision.teamAPlayerIds, 'playing');
    const teamB = await createTeam(court.session_id, decision.teamBPlayerIds, 'playing');
    await assignCourt(courtId, teamA.id, teamB.id);
    return { teamA, teamB };
  }

  // ---------- MANUAL MODE (semi-automated pairing) ----------
  //
  // Manual mode never auto-pairs — the host hand-picks who plays next from
  // the four live cards (Winning/Losing/Resting/Late Arrivals). A built
  // match either starts immediately on an open court, or — if every court
  // is busy — is held as a "prepared match" (Up Next) and released to the
  // next court that frees, oldest-prepared first. This mirrors the
  // automated engine's court-filling mechanics without its auto-pairing.

  /**
   * Build a match from host-picked players. Doubles picks are split into
   * two skill-balanced teams (same balancing logic the automated engine
   * uses); singles picks are 1v1 as-is — the host already chose exactly
   * who plays whom, there's nothing left to balance.
   */
  // Shared by buildManualMatch (auto-split pairing) AND promoteDraftCard
  // (host-chosen exact pairing) — creates the two teams and either starts
  // them immediately on an open court or queues them as Up Next.
  async function queueOrStartTeams(sessionId, teamAIds, teamBIds) {
    const teamA = await createTeam(sessionId, teamAIds, 'waiting');
    const teamB = await createTeam(sessionId, teamBIds, 'waiting');

    const { data: openCourts } = await supabaseClient.from('courts')
      .select('*').eq('session_id', sessionId).eq('status', 'open')
      .order('court_number', { ascending: true }).limit(1);
    const openCourt = (openCourts || [])[0];

    if (openCourt) {
      await assignCourt(openCourt.id, teamA.id, teamB.id);
      return { started: true, courtNumber: openCourt.court_number };
    }

    const { error: prepErr } = await supabaseClient.from('prepared_matches')
      .insert({ session_id: sessionId, team_a_id: teamA.id, team_b_id: teamB.id, status: 'pending' });
    if (prepErr) {
      const missingTable = prepErr.code === '42P01' || /does not exist|could not find the .* column/i.test(prepErr.message || '');
      const rlsBlocked = prepErr.code === '42501' || /row-level security|permission denied/i.test(prepErr.message || '');
      if (missingTable) {
        throw new Error('Database missing the prepared_matches table — run in Supabase SQL Editor: ' +
          "CREATE TABLE IF NOT EXISTS prepared_matches (id uuid primary key default gen_random_uuid(), " +
          "session_id uuid references sessions(id), team_a_id uuid references teams(id), " +
          "team_b_id uuid references teams(id), status text default 'pending', created_at timestamptz default now());");
      }
      if (rlsBlocked) {
        throw new Error('The prepared_matches table exists but Row Level Security is blocking it — run in Supabase SQL Editor: ' +
          'ALTER TABLE prepared_matches DISABLE ROW LEVEL SECURITY;');
      }
      throw prepErr;
    }
    return { started: false };
  }

  async function buildManualMatch(sessionId, playerIds) {
    const ids = [...new Set(playerIds || [])];
    if (ids.length !== 2 && ids.length !== 4) {
      throw new Error('Pick exactly 2 players (singles) or 4 players (doubles).');
    }

    const { data: players, error: pErr } = await supabaseClient.from('players')
      .select('id, status, skill_tier, last_match_result, recent_opponent_ids').in('id', ids);
    if (pErr) throw pErr;
    if (!players || players.length !== ids.length) {
      throw new Error('One of the selected players is no longer available.');
    }
    const notReady = players.find(p => !['waiting', 'resting'].includes(p.status));
    if (notReady) throw new Error('One of the selected players is already in a match.');

    let teamAIds, teamBIds;
    if (players.length === 2) {
      teamAIds = [players[0].id];
      teamBIds = [players[1].id];
    } else {
      const split = decideSkillBalancedTeams(players);
      if (!split) throw new Error('Could not split these 4 players into two teams.');
      teamAIds = split.teamAPlayerIds;
      teamBIds = split.teamBPlayerIds;
    }

    return queueOrStartTeams(sessionId, teamAIds, teamBIds);
  }

  // ════════════════════════════════════════════
  // DRAFT CARDS — the flexible pairing-arrangement board. Each card is a
  // 2×2 grid (slot_1/slot_2 = one team, slot_3/slot_4 = the other),
  // fillable incrementally and rearrangeable via drag or tap before being
  // promoted into a real queued match. This is the layer BELOW
  // prepared_matches — nothing here touches player status or the real
  // queue until a card is fully filled and explicitly promoted.
  // ════════════════════════════════════════════
  function isDraftCardsMissing(err) {
    return err && (err.code === '42P01' || /does not exist|could not find the .* (table|column)/i.test(err.message || ''));
  }
  function isDraftCardsRlsBlocked(err) {
    return err && (err.code === '42501' || /row-level security|permission denied/i.test(err.message || ''));
  }
  function draftCardsMigrationError(err) {
    if (isDraftCardsMissing(err)) {
      return new Error('Database is missing the draft_cards table. Run this in Supabase SQL Editor:\n\n' +
        "CREATE TABLE IF NOT EXISTS draft_cards (\n" +
        "  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n" +
        "  session_id uuid REFERENCES sessions(id) ON DELETE CASCADE,\n" +
        "  slot_1 uuid REFERENCES players(id),\n" +
        "  slot_2 uuid REFERENCES players(id),\n" +
        "  slot_3 uuid REFERENCES players(id),\n" +
        "  slot_4 uuid REFERENCES players(id),\n" +
        "  position integer DEFAULT 0,\n" +
        "  created_at timestamptz DEFAULT now()\n" +
        ");");
    }
    if (isDraftCardsRlsBlocked(err)) {
      return new Error('Row Level Security is blocking draft_cards — run in Supabase SQL Editor:\n\nALTER TABLE draft_cards DISABLE ROW LEVEL SECURITY;');
    }
    return err;
  }

  async function getDraftCards(sessionId) {
    const { data, error } = await supabaseClient.from('draft_cards')
      .select('*').eq('session_id', sessionId).order('position', { ascending: true });
    if (error) {
      if (isDraftCardsMissing(error) || isDraftCardsRlsBlocked(error)) return [];
      throw error;
    }
    return data || [];
  }
  async function createDraftCard(sessionId) {
    const { data: existing } = await supabaseClient.from('draft_cards')
      .select('position').eq('session_id', sessionId).order('position', { ascending: false }).limit(1);
    const nextPos = existing && existing.length ? existing[0].position + 1 : 0;
    const { data, error } = await supabaseClient.from('draft_cards')
      .insert({ session_id: sessionId, position: nextPos }).select().single();
    if (error) throw draftCardsMigrationError(error);
    return data;
  }
  async function deleteDraftCard(cardId) {
    const { error } = await supabaseClient.from('draft_cards').delete().eq('id', cardId);
    if (error) throw draftCardsMigrationError(error);
  }
  // Places a player into a specific slot. If that slot is already
  // occupied, the two players SWAP (the slot's previous occupant goes
  // wherever the incoming player came from, if anywhere) — callers pass
  // the incoming player's previous location (another card+slot, or null
  // if they were still in the waiting pool) so this can do a clean swap
  // in one round trip instead of a lossy overwrite.
  async function assignDraftSlot(cardId, slotNum, playerId, fromCardId, fromSlotNum) {
    const field = `slot_${slotNum}`;
    const { data: targetCard, error: tErr } = await supabaseClient.from('draft_cards').select('*').eq('id', cardId).single();
    if (tErr) throw draftCardsMigrationError(tErr);
    const displaced = targetCard[field]; // whoever was in the target slot, if anyone

    const updates = [supabaseClient.from('draft_cards').update({ [field]: playerId }).eq('id', cardId)];
    if (fromCardId && fromSlotNum) {
      // Player came from another slot — put whoever was displaced there
      // (or clear it if the target slot was empty).
      const fromField = `slot_${fromSlotNum}`;
      updates.push(supabaseClient.from('draft_cards').update({ [fromField]: displaced || null }).eq('id', fromCardId));
    }
    const results = await Promise.all(updates);
    const err = results.find(r => r.error)?.error;
    if (err) throw draftCardsMigrationError(err);
  }
  async function clearDraftSlot(cardId, slotNum) {
    const field = `slot_${slotNum}`;
    const { error } = await supabaseClient.from('draft_cards').update({ [field]: null }).eq('id', cardId);
    if (error) throw draftCardsMigrationError(error);
  }
  // Once all 4 slots are filled: slot_1+slot_2 become Team A, slot_3+
  // slot_4 become Team B — the EXACT pairing the host built, never
  // re-split or auto-balanced. Reuses queueOrStartTeams so it goes
  // straight to an open court if one exists, or joins Up Next otherwise —
  // identical downstream behavior to any other manually-built match.
  async function promoteDraftCard(cardId, sessionId) {
    const { data: card, error } = await supabaseClient.from('draft_cards').select('*').eq('id', cardId).single();
    if (error) throw draftCardsMigrationError(error);
    const slots = [card.slot_1, card.slot_2, card.slot_3, card.slot_4];
    if (slots.some(s => !s)) throw new Error('Fill all 4 slots before queueing this card.');

    const { data: players, error: pErr } = await supabaseClient.from('players')
      .select('id, status').in('id', slots);
    if (pErr) throw pErr;
    const notReady = (players || []).find(p => !['waiting', 'resting'].includes(p.status));
    if (notReady) throw new Error('One of these players is no longer available — remove them from the card and try again.');

    const result = await queueOrStartTeams(sessionId, [card.slot_1, card.slot_2], [card.slot_3, card.slot_4]);
    await deleteDraftCard(cardId);
    return result;
  }

  async function getPreparedMatches(sessionId) {
    const { data, error } = await supabaseClient.from('prepared_matches')
      .select('*, team_a:team_a_id(*), team_b:team_b_id(*)')
      .eq('session_id', sessionId).eq('status', 'pending')
      .order('created_at', { ascending: true });
    if (error) {
      // Graceful fallback either way (missing table OR RLS blocking the
      // read) — this just means "nothing prepared yet" from the UI's
      // perspective, not worth surfacing as an error for a background read.
      const missingTable = error.code === '42P01' || /does not exist|could not find the .* column/i.test(error.message || '');
      const rlsBlocked = error.code === '42501' || /row-level security|permission denied/i.test(error.message || '');
      if (missingTable || rlsBlocked) return [];
      throw error;
    }
    return data || [];
  }

  async function cancelPreparedMatch(matchId) {
    const { data: pm } = await supabaseClient.from('prepared_matches').select('*').eq('id', matchId).single();
    if (!pm) return;
    await supabaseClient.from('teams').update({ is_active: false }).in('id', [pm.team_a_id, pm.team_b_id]);
    const { data: teamRows } = await supabaseClient.from('teams').select('player_ids').in('id', [pm.team_a_id, pm.team_b_id]);
    const playerIds = (teamRows || []).flatMap(t => t.player_ids || []);
    if (playerIds.length) {
      await supabaseClient.from('players').update({ status: 'waiting', became_free_at: new Date().toISOString() }).in('id', playerIds);
    }
    await supabaseClient.from('prepared_matches').delete().eq('id', matchId);
  }

  /** Release the oldest prepared match onto a court that just freed up. */
  async function tryReleasePreparedMatch(courtId, sessionId) {
    const { data: court } = await supabaseClient.from('courts').select('*').eq('id', courtId).single();
    if (!court || court.status === 'in_progress') return null;

    const { data: prepared, error } = await supabaseClient.from('prepared_matches')
      .select('*').eq('session_id', sessionId).eq('status', 'pending')
      .order('created_at', { ascending: true }).limit(1);
    if (error) {
      if (error.code === '42P01' || error.code === '42501' || /does not exist|could not find the .* column|row-level security|permission denied/i.test(error.message || '')) return null; // table missing or RLS-blocked — nothing to release either way
      throw error;
    }
    const next = (prepared || [])[0];
    if (!next) return null;

    await assignCourt(courtId, next.team_a_id, next.team_b_id);
    await supabaseClient.from('prepared_matches').update({ status: 'assigned' }).eq('id', next.id);
    return next;
  }

  // ---------- INBOX ----------

  async function getPendingRestRequests(sessionId) {
    const { data, error } = await supabaseClient.from('rest_requests')
      .select('*, player:player_id(*)').eq('session_id', sessionId).eq('status', 'pending');
    if (error) throw error;
    return data;
  }

  async function confirmRestRequest(requestId, playerId) {
    const { data: player } = await supabaseClient.from('players').select('*').eq('id', playerId).single();
    if (!player) throw new Error('Player not found.');
    await supabaseClient.from('rest_requests')
      .update({ status: 'confirmed', resolved_at: new Date().toISOString() }).eq('id', requestId);
    if (player.status === 'playing') {
      // Can't rest someone mid-match without breaking their court — instead,
      // flag a preference that the disposition modal reads and pre-selects
      // for THIS player once their match actually ends. The host still sees
      // every player's choice in that modal and can change it there; this
      // just sets the sensible default instead of quietly defaulting to
      // Queue and requiring the host to remember and manually fix it.
      const { error: updErr } = await supabaseClient.from('players')
        .update({ pending_disposition: 'rest' }).eq('id', playerId);
      if (updErr && /pending_disposition/i.test(updErr.message || '')) {
        // Migration not run yet — fall back to the old "just remind the
        // host" behavior rather than throwing and losing the confirmation.
        return { deferred: true, migrationMissing: true };
      }
      return { deferred: true };
    }
    await restPlayerNow(playerId, player.session_id);
    return { deferred: false };
  }

  async function declineRestRequest(requestId) {
    const { error } = await supabaseClient.from('rest_requests')
      .update({ status: 'declined', resolved_at: new Date().toISOString() }).eq('id', requestId);
    if (error) throw error;
  }

  async function getMessages(sessionId, statusFilter = null) {
    let query = supabaseClient.from('messages').select('*').eq('session_id', sessionId).order('created_at', { ascending: false });
    if (statusFilter) query = query.eq('status', statusFilter);
    const { data, error } = await query;
    if (error) throw error;
    return data;
  }

  async function markMessageStatus(messageId, status) {
    const { error } = await supabaseClient.from('messages').update({ status }).eq('id', messageId);
    if (error) throw error;
  }

  // ---------- LEADERBOARD VISIBILITY ----------

  async function setLeaderboardVisible(sessionId, visible) {
    const { error } = await supabaseClient.from('sessions')
      .update({ leaderboard_public: visible }).eq('id', sessionId);
    if (error) throw error;
  }

  /**
   * Correct a previously recorded match result — winner, score, or both.
   *
   * WHY RECOMPUTE INSTEAD OF DELTA:
   *   Delta arithmetic (subtract old, add new) silently compounds any
   *   prior data errors — triple-submits, null scores from the old "skip
   *   score" flow, or any other inconsistency. By re-summing each player's
   *   full match history AFTER patching the target row, we always converge
   *   to ground truth regardless of what the current DB values say.
   *
   * @param {string}      matchId          matches.id to correct
   * @param {string|null} newWinnerTeamId  teams.id that should now be the winner,
   *                                       or null to keep the current winner
   * @param {number|null} newLoserScore    corrected losing score (0+), or null
   *                                       to keep the existing score
   */
  async function correctMatchResult(matchId, newWinnerTeamId, newLoserScore = null) {

    // ── 1. Load and validate the target match ──────────────────────────────
    const { data: match, error: matchErr } = await supabaseClient
      .from('matches').select('*').eq('id', matchId).single();
    if (matchErr || !match) throw new Error('Match record not found.');

    const finalWinnerTeamId = newWinnerTeamId || match.winner_team_id;
    const finalLoserTeamId  = finalWinnerTeamId === match.team_a_id
      ? match.team_b_id : match.team_a_id;

    const oldLoserScore = match.winner_team_id === match.team_a_id
      ? match.team_b_score : match.team_a_score;
    const resolvedLoserScore  = newLoserScore !== null ? newLoserScore : (oldLoserScore ?? 0);
    const _deuce = activeSession?.deuce_enabled !== false;
    const resolvedWinnerScore = (_deuce && resolvedLoserScore >= 10) ? resolvedLoserScore + 2 : 11;

    // Guard: nothing to do.
    const noWinnerChange = match.winner_team_id === finalWinnerTeamId;
    const noScoreChange  = (newLoserScore === null) || (newLoserScore === (oldLoserScore ?? null));
    if (noWinnerChange && noScoreChange) {
      throw new Error('No changes detected — winner and score are already as recorded.');
    }

    // ── 2. Patch the match row first so the recompute sees the corrected data ──
    const newTeamAScore = finalWinnerTeamId === match.team_a_id
      ? resolvedWinnerScore : resolvedLoserScore;
    const newTeamBScore = finalWinnerTeamId === match.team_a_id
      ? resolvedLoserScore  : resolvedWinnerScore;
    const { error: patchErr } = await supabaseClient.from('matches').update({
      winner_team_id: finalWinnerTeamId,
      team_a_score:   newTeamAScore,
      team_b_score:   newTeamBScore,
      score_visible:  true,
    }).eq('id', matchId);
    if (patchErr) throw patchErr;

    // ── 3. Find the 4 player IDs involved ──────────────────────────────────
    const { data: teamRows } = await supabaseClient
      .from('teams').select('id, player_ids')
      .in('id', [match.team_a_id, match.team_b_id]);
    if (!teamRows?.length) throw new Error('Could not load team rosters.');

    const allPlayerIds = [...new Set(teamRows.flatMap(t => t.player_ids || []))];
    if (!allPlayerIds.length) throw new Error('No players found for this match.');

    // ── 4. Recompute stats from FULL match history for everyone involved ──
    await recomputeStatsForPlayers(match.session_id, allPlayerIds);
  }

  /**
   * Re-sums wins/losses/points/games-played for the given players from
   * their FULL current match history — immune to accumulated delta errors,
   * and doubles as the leaderboard cleanup after a match is corrected OR
   * deleted (a removed match simply won't be in the history anymore).
   */
  async function recomputeStatsForPlayers(sessionId, playerIds) {
    for (const playerId of playerIds) {
      // All matches this player's team_a or team_b was involved in
      // (we query by session to keep it fast; player IDs are contained
      //  inside teams.player_ids which we can't filter on the DB directly,
      //  so we pull all session matches and filter in JS).
      const { data: sessionMatches } = await supabaseClient
        .from('matches')
        .select('id, team_a_id, team_b_id, winner_team_id, team_a_score, team_b_score')
        .eq('session_id', sessionId);

      // Find the teams that ever contained this player.
      const { data: playerTeams } = await supabaseClient
        .from('teams')
        .select('id, player_ids')
        .eq('session_id', sessionId)
        .contains('player_ids', [playerId]);

      const playerTeamIds = new Set((playerTeams || []).map(t => t.id));

      let totalWins = 0, totalLosses = 0, totalPoints = 0, totalGP = 0;

      for (const m of sessionMatches || []) {
        const playerOnTeamA = playerTeamIds.has(m.team_a_id);
        const playerOnTeamB = playerTeamIds.has(m.team_b_id);
        if (!playerOnTeamA && !playerOnTeamB) continue;

        totalGP++;
        const playerTeamId = playerOnTeamA ? m.team_a_id : m.team_b_id;
        const won = m.winner_team_id === playerTeamId;

        if (won) totalWins++;
        else     totalLosses++;

        // Points: player's team score for this match (null-safe → 0).
        const playerScore = playerOnTeamA
          ? (m.team_a_score ?? 0)
          : (m.team_b_score ?? 0);
        totalPoints += playerScore;
      }

      await supabaseClient.from('players').update({
        wins:               totalWins,
        losses:             totalLosses,
        total_games_played: totalGP,
        total_points:       totalPoints,
      }).eq('id', playerId);
    }
  }

  /**
   * Permanently delete a recorded match and scrub its effect from the
   * leaderboard — the 4 players involved get their stats recomputed from
   * whatever match history remains, so the deleted match's wins/losses/
   * points disappear from the rankings immediately.
   */
  async function deleteMatchResult(matchId) {
    const { data: match, error: matchErr } = await supabaseClient
      .from('matches').select('*').eq('id', matchId).single();
    if (matchErr || !match) throw new Error('Match record not found.');

    const { data: teamRows } = await supabaseClient
      .from('teams').select('id, player_ids')
      .in('id', [match.team_a_id, match.team_b_id]);
    const allPlayerIds = [...new Set((teamRows || []).flatMap(t => t.player_ids || []))];

    const { error: delErr } = await supabaseClient.from('matches').delete().eq('id', matchId);
    if (delErr) throw delErr;

    if (allPlayerIds.length) await recomputeStatsForPlayers(match.session_id, allPlayerIds);
  }

  async function getRecentMatches(sessionId, limit = 20) {
    const { data, error } = await supabaseClient.from('matches')
      .select('*, team_a:team_a_id(*), team_b:team_b_id(*)')
      .eq('session_id', sessionId)
      .order('ended_at', { ascending: false })
      .limit(limit);
    if (error) throw error;
    return data;
  }

  async function carryPlayersToNewSession(newSessionId, playerRows) {
    const inserted = [];
    for (const p of playerRows) {
      const { data, error } = await supabaseClient.from('players')
        .insert({ session_id: newSessionId, name: p.name, skill_tier: p.skill_tier || 'open', status: 'expected' })
        .select().single();
      if (error) throw error;
      inserted.push(data);
    }
    return inserted;
  }

  // Tournament equivalent of the above — teams live in bracket_entries, not
  // the open-play players table, so "Host Again" for a tournament needs its
  // own carry-over path entirely.
  async function getTournamentTeams(sessionId) {
    const { data, error } = await supabaseClient.from('bracket_entries')
      .select('*').eq('session_id', sessionId).eq('is_bye', false).order('seed', { ascending: true });
    if (error) throw error;
    return data || [];
  }
  async function carryTeamsToNewSession(newSessionId, teamRows) {
    const inserted = [];
    for (const t of teamRows) {
      const row = {
        session_id: newSessionId, is_bye: false,
        team_name: t.team_name, player1_name: t.player1_name || null, player2_name: t.player2_name || null,
      };
      let { data, error } = await supabaseClient.from('bracket_entries').insert(row).select().single();
      if (error && /logo_url|player1_photo|player2_photo/.test(error.message || '')) {
        // Shouldn't normally trigger since we're not sending those fields,
        // but guard anyway for consistency with the rest of the codebase.
        ({ data, error } = await supabaseClient.from('bracket_entries')
          .insert({ session_id: newSessionId, is_bye: false, team_name: t.team_name }).select().single());
      }
      if (error) throw error;
      // Carry photos/logo separately so a missing-column error on THIS
      // update never blocks the team from being created in the first place.
      if (data && (t.logo_url || t.player1_photo || t.player2_photo)) {
        await supabaseClient.from('bracket_entries').update({
          logo_url: t.logo_url || null, player1_photo: t.player1_photo || null, player2_photo: t.player2_photo || null,
        }).eq('id', data.id).then(({ error: e2 }) => { if (e2 && !/logo_url|player1_photo|player2_photo/.test(e2.message||'')) throw e2; });
      }
      if (data) inserted.push(data);
    }
    return inserted;
  }

  /**
   * Permanently delete a completed session and all its data.
   * Child tables are deleted in dependency order before the session row.
   * Only completed sessions can be deleted — active sessions must be
   * finished first.
   */
  async function deleteSession(sessionId) {
    const session = await getSession(sessionId);
    // Active sessions are auto-finished then deleted (no separate step needed).
    if (session.status === 'active') {
      await supabaseClient.from('sessions')
        .update({ status: 'completed', ended_at: new Date().toISOString() })
        .eq('id', sessionId);
    }

    // 1. Clear FK references FROM courts TO teams so teams can be deleted.
    //    (courts.team_a_id / team_b_id point at teams — must null them first.)
    await supabaseClient.from('courts')
      .update({ team_a_id: null, team_b_id: null, status: 'open' })
      .eq('session_id', sessionId);

    // 2. Tournament children first (bracket_matches → bracket_entries → brackets).
    const { data: brackets } = await supabaseClient.from('brackets')
      .select('id').eq('session_id', sessionId);
    for (const b of brackets || []) {
      await supabaseClient.from('bracket_matches').delete().eq('bracket_id', b.id);
      await supabaseClient.from('bracket_entries').delete().eq('bracket_id', b.id);
    }
    await supabaseClient.from('bracket_entries').delete().eq('session_id', sessionId);
    await supabaseClient.from('brackets').delete().eq('session_id', sessionId);

    // 3. Open-play children in safe order (most-dependent first).
    const tables = [
      'matches',
      'tournament_matchups',
      'manual_queue',
      'rest_requests',
      'messages',
      'courts',   // deleted BEFORE teams now (court refs already nulled)
      'teams',
      'players',
    ];
    for (const table of tables) {
      const { error } = await supabaseClient.from(table)
        .delete().eq('session_id', sessionId);
      if (error && error.code !== 'PGRST116' && error.code !== '42P01') throw error;
    }

    const { error } = await supabaseClient.from('sessions').delete().eq('id', sessionId);
    if (error) throw error;
  }

  /**
   * Count matches played in a session — shown in the delete confirmation
   * so the host knows exactly what they're about to lose.
   */
  async function getMatchCount(sessionId) {
    const { count, error } = await supabaseClient.from('matches')
      .select('id', { count: 'exact', head: true }).eq('session_id', sessionId);
    if (error) return 0;
    return count || 0;
  }

  return {
    createSession, getSession, getSessionByReferenceCode, getMySessions,
    verifySessionPassword, finishSession, deleteSession, getMatchCount,
    preRegisterPlayer, updatePlayer, markArrived, getPlayers, getAllPlayersIncludingLeft,
    removePlayer, restPlayerManually, returnToQueue,
    createTeam, getTeams, getCourts, assignCourt, logMatchResult, applyQueuePlacement, tryRefillCourt, shuffleQueue, reconcileOrphanedPlayers, swapPlayerOnTeam,
    buildManualMatch, getPreparedMatches, cancelPreparedMatch, tryReleasePreparedMatch,
    getDraftCards, createDraftCard, deleteDraftCard, assignDraftSlot, clearDraftSlot, promoteDraftCard,
    getPendingRestRequests, confirmRestRequest, declineRestRequest,
    getMessages, markMessageStatus, setLeaderboardVisible,
    correctMatchResult, deleteMatchResult, getRecentMatches,
    carryPlayersToNewSession, getTournamentTeams, carryTeamsToNewSession,
  };
})();
window.SessionAPI = SessionAPI;

let activeSession = null;

init();

async function init() {
  applyThemeIcon();

  // Always verify the saved session is still valid — don't just trust localStorage.
  // A stale, corrupted, or pre-auth-system session must be rejected.
  if (currentHost?.id) {
    try {
      let { data, error } = await supabaseClient
        .from('host_accounts')
        .select('id, name, email, is_active, allow_open_play, allow_tournament')
        .eq('id', currentHost.id)
        .single();
      if (error && /allow_open_play|allow_tournament/.test(error.message || '')) {
        ({ data, error } = await supabaseClient
          .from('host_accounts')
          .select('id, name, email, is_active')
          .eq('id', currentHost.id)
          .single());
      }

      if (error || !data || !data.is_active) {
        // Account deleted, deactivated, or localStorage corrupted — force re-login.
        clearHostSession();
        currentHost = null;
        renderLoginScreen();
        return;
      }
      // Refresh currentHost with live data in case name/email/permissions changed.
      currentHost = { id: data.id, name: data.name, email: data.email, allow_open_play: data.allow_open_play, allow_tournament: data.allow_tournament };
      saveHostSession(currentHost);
    } catch (_) {
      clearHostSession();
      currentHost = null;
      renderLoginScreen();
      return;
    }
  } else {
    // No saved session or saved session has no id.
    clearHostSession();
    currentHost = null;
    renderLoginScreen();
    return;
  }

  renderTopbarHost();
  try { await renderSessionList(); }
  catch (err) {
    document.getElementById('appRoot').innerHTML =
      `<div class="card"><h2>Couldn't load sessions</h2><p style="color:var(--fault-coral);font-size:13px;">${escapeHtml(err.message)}</p></div>`;
  }
}

async function handleRequestOTP() {
  const email = document.getElementById('loginEmail')?.value?.trim();
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('requestOtpBtn');
  if (!email) { if (errEl) errEl.textContent = 'Enter your email.'; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    const { email: confirmedEmail, hostName } = await AccountAPI.requestLoginOTP(email);
    renderOTPScreen(confirmedEmail, hostName);
  } catch (err) {
    if (errEl) errEl.textContent = err.message || 'Could not send code. Please try again.';
    if (btn) { btn.disabled = false; btn.textContent = 'Send Code'; }

// 8 separate digit boxes, auto-advancing — matches the OTP UX already
// proven in the Balay Maysa system this was modeled after.
function renderOTPScreen(email, hostName) {
  window._otpEmail = email;
  window._otpResendCooldown = 60;
  document.getElementById('appRoot').innerHTML = `
    <div class="auth-box" style="margin-top:96px;">
      <h1 style="font-size:18px;margin-bottom:4px;">Enter Your Code</h1>
      <p class="sub">${hostName ? `Hi ${escapeHtml(hostName)} — a` : 'A'} code was sent to ${escapeHtml(email)}. It expires in 10 minutes.</p>
      <div id="otpDigitsRow" style="display:flex;gap:6px;justify-content:center;margin:18px 0;" onpaste="handleOTPPaste(event)">
        ${Array.from({ length: 8 }, (_, i) => `
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit-box" data-idx="${i}"
            style="width:34px;height:44px;text-align:center;font-size:18px;font-weight:800;border-radius:var(--radius-sm);
              border:1.5px solid var(--border-soft);background:var(--surface-hover);color:var(--ink);font-family:var(--font-mono);"
            oninput="handleOTPDigitInput(this,${i})" onkeydown="handleOTPDigitKeydown(event,${i})">
        `).join('')}
      </div>
      <div class="auth-error" id="otpError"></div>
      <button class="btn-primary" id="verifyOtpBtn" onclick="handleVerifyOTP()">Verify &amp; Sign In</button>
      <p style="font-size:12px;text-align:center;margin:14px 0 0;">
        <a href="javascript:void(0)" id="resendOtpLink" onclick="handleResendOTP()" style="color:var(--waiting-blue);font-weight:700;">Resend code</a>
        <span id="resendCooldownLabel" style="color:var(--ink-muted);"></span>
      </p>
      <p style="font-size:12px;text-align:center;margin:8px 0 0;">
        <a href="javascript:void(0)" onclick="renderLoginScreen()" style="color:var(--ink-muted);font-weight:600;">← Use a different email</a>
      </p>
    </div>
  `;
  startOTPResendCooldown();
  document.querySelector('.otp-digit-box[data-idx="0"]')?.focus();
}

function handleOTPDigitInput(el, idx) {
  el.value = el.value.replace(/\D/g, '').slice(0, 1);
  if (el.value && idx < 7) {
    document.querySelector(`.otp-digit-box[data-idx="${idx + 1}"]`)?.focus();
  }
  const full = getOTPDigitsValue();
  if (full.length === 8) handleVerifyOTP();
}
function handleOTPDigitKeydown(e, idx) {
  if (e.key === 'Backspace' && !e.target.value && idx > 0) {
    document.querySelector(`.otp-digit-box[data-idx="${idx - 1}"]`)?.focus();
  }
}
function handleOTPPaste(e) {
  const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 8);
  if (!text) return;
  e.preventDefault();
  [...text].forEach((d, i) => {
    const box = document.querySelector(`.otp-digit-box[data-idx="${i}"]`);
    if (box) box.value = d;
  });
  const last = Math.min(text.length, 8) - 1;
  document.querySelector(`.otp-digit-box[data-idx="${last}"]`)?.focus();
  if (text.length === 8) handleVerifyOTP();
}
function getOTPDigitsValue() {
  return [...document.querySelectorAll('.otp-digit-box')].map(el => el.value || '').join('');
}

async function handleVerifyOTP() {
  const code = getOTPDigitsValue();
  const errEl = document.getElementById('otpError');
  const btn   = document.getElementById('verifyOtpBtn');
  if (code.length !== 8) { if (errEl) errEl.textContent = 'Enter all 8 digits.'; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Verifying…'; }
  try {
    const host = await AccountAPI.verifyLoginOTP(window._otpEmail, code);
    currentHost = host;
    saveHostSession(host);
    renderTopbarHost();
    await renderSessionList();
  } catch (err) {
    if (errEl) errEl.textContent = err.message || 'Could not verify code.';
    if (btn) { btn.disabled = false; btn.textContent = 'Verify & Sign In'; }
    document.querySelectorAll('.otp-digit-box').forEach(el => el.value = '');
    document.querySelector('.otp-digit-box[data-idx="0"]')?.focus();
  }
}

function startOTPResendCooldown() {
  const link = document.getElementById('resendOtpLink');
  const label = document.getElementById('resendCooldownLabel');
  if (link) { link.style.pointerEvents = 'none'; link.style.opacity = '0.4'; }
  const tick = () => {
    window._otpResendCooldown--;
    if (label) label.textContent = window._otpResendCooldown > 0 ? ` (wait ${window._otpResendCooldown}s)` : '';
    if (window._otpResendCooldown <= 0) {
      clearInterval(window._otpResendInterval);
      if (link) { link.style.pointerEvents = ''; link.style.opacity = ''; }
    }
  };
  clearInterval(window._otpResendInterval);
  window._otpResendInterval = setInterval(tick, 1000);
}
async function handleResendOTP() {
  if (window._otpResendCooldown > 0) return;
  const errEl = document.getElementById('otpError');
  try {
    const { hostName } = await AccountAPI.requestLoginOTP(window._otpEmail);
    renderOTPScreen(window._otpEmail, hostName);
  } catch (err) {
    if (errEl) errEl.textContent = err.message || 'Could not resend code.';
  }
}

function hostLogout() {
  currentHost = null;
  clearHostSession();
  // Also clear all session unlocks — they belong to this host's session.
  if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  if (hostTimerInterval) clearInterval(hostTimerInterval);
  activeSession = null;
  renderLoginScreen();
}

async function handleCreateSession() {
  const name = document.getElementById('newName').value.trim() || 'Session';
  const courtCount = parseInt(document.getElementById('newCourtCount').value, 10) || 1;
  const errorEl = document.getElementById('createSessionError');
  errorEl.textContent = '';

  // Defense in depth — even though the UI hides the disallowed type's
  // button, don't trust client state alone to block session creation.
  if (_newSessionType === 'open_play' && currentHost?.allow_open_play === false) {
    errorEl.textContent = 'This account does not have Open Play access. Contact your administrator.';
    return;
  }
  if (_newSessionType === 'tournament' && currentHost?.allow_tournament === false) {
    errorEl.textContent = 'This account does not have Tournament access. Contact your administrator.';
    return;
  }

  let format, category, division;
  if (_newSessionType === 'tournament') {
    category = document.getElementById('newCategory').value;
    division = document.getElementById('newDivision').value;
    format = division.endsWith('_singles') ? 'singles' : 'doubles';
  } else {
    format = document.getElementById('newFormat').value;
  }
  const deuceEnabled = _newSessionType === 'tournament' ? false
    : (document.getElementById('newDeuce')?.value !== 'off');

  const pairingMode = _newSessionType === 'open_play' ? _newPairingMode : null;

  try {
    const session = await SessionAPI.createSession({ name, format, courtCount, sessionType: _newSessionType, category, division, deuceEnabled, pairingMode });
    await openSession(session.id);
  } catch (err) {
    errorEl.textContent = err.message;
  }
}
